<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Transport Warm-Up: CAST-Style Practice Task</title>
<style>
:root{
  --navy:#17365d; --blue:#2a6fb5; --pale:#eef4fa; --line:#c5d3e2; --ink:#1c2733; --muted:#586878;
  --ok:#1b7f4b; --okbg:#e6f4ec; --bad:#b3261e; --badbg:#fbeceb; --flag:#d99a00; --paper:#fff; --hl:#fff3c4;
  --fs:17px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#dfe7f0;font-size:var(--fs);line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #f2b705;outline-offset:2px}

/* top bar */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.2px}
.top small{display:block;font-weight:400;color:#b8cbe2;font-size:.78rem}
.tools button{background:transparent;color:#fff;border:1px solid #6d8bb0;border-radius:4px;padding:3px 10px;margin-left:6px}
.tools button:hover{background:#25497a}

#root{height:calc(100% - 58px)}

/* intro / review / results screens */
.screen{max-width:860px;margin:26px auto;background:var(--paper);border:1px solid var(--line);padding:30px 36px;border-radius:4px}
.screen h2{margin:0 0 6px;color:var(--navy);font-size:1.6rem}
.screen h3{color:var(--navy);margin:22px 0 6px;font-size:1.1rem}
.phen{background:var(--pale);border-left:6px solid var(--blue);padding:14px 18px;margin:16px 0}
.phen b{color:var(--navy)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 22px;font-weight:600}
.btn:hover{background:#215c98}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--pale)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.namebox{margin:14px 0}
.namebox input{font:inherit;padding:8px 10px;border:1.5px solid #8ea4bc;border-radius:4px;width:280px;max-width:100%}

/* test layout */
.app{display:grid;grid-template-columns:1.12fr 1fr;height:calc(100% - 62px)}
.stim,.qp{overflow:auto;padding:0}
.stim{background:#f6f9fc;border-right:3px solid var(--navy)}
.qp{background:var(--paper)}
.pane-head{position:sticky;top:0;z-index:2;background:#e3ecf5;border-bottom:1px solid var(--line);padding:8px 14px;font-weight:600;color:var(--navy);font-size:.92rem}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:#e3ecf5;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:none;background:#cfdcea;color:var(--navy);padding:7px 14px;border-radius:5px 5px 0 0;font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:#fff;border-color:var(--navy);border-bottom:2px solid #fff;margin-bottom:-1px}
.tabbody{padding:18px 22px 40px}
.tabbody h2{font-size:1.1rem;color:var(--navy);margin:0 0 8px}
.passage p{font-family:Georgia,"Times New Roman",serif;font-size:1.02em;line-height:1.62;margin:0 0 12px;max-width:66ch}
.passage mark{background:var(--hl)}
.cap{font-size:.85rem;color:var(--muted);margin-top:6px}
figure{margin:0}
svg text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
table.data{border-collapse:collapse;width:100%;background:#fff;font-size:.93rem;margin:6px 0 16px}
table.data th,table.data td{border:1px solid #9db2c9;padding:6px 9px;text-align:left;vertical-align:top}
table.data th{background:#dbe6f2;color:var(--navy)}

.qbody{padding:18px 24px 40px}
.qnum{font-weight:700;color:#fff;background:var(--navy);display:inline-block;padding:2px 10px;border-radius:3px;margin-right:8px}
.qtype{font-size:.82rem;color:var(--muted);margin:4px 0 10px}
.prompt{font-size:1.02em;margin:10px 0 14px}
.hint{background:var(--hl);border:1px solid #e6cf7a;border-radius:4px;padding:6px 10px;font-size:.88rem;margin-bottom:12px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #b7c7d9;border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer;background:#fff}
label.opt:hover{background:var(--pale)}
label.opt.sel{border-color:var(--blue);background:#e4effb}
label.opt input{margin-top:5px;transform:scale(1.2)}
table.match{border-collapse:collapse;width:100%;font-size:.93rem}
table.match th,table.match td{border:1px solid #9db2c9;padding:7px 8px}
table.match th{background:#dbe6f2;color:var(--navy);text-align:center}
table.match td:first-child{text-align:left}
table.match td{text-align:center}
table.match input{transform:scale(1.25)}
.eq{background:var(--pale);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:1.05rem;margin:10px 0;line-height:2.4}
.eq input,.inline input{font:inherit;width:64px;text-align:center;padding:4px;border:1.5px solid #6f89a6;border-radius:4px}
.sup{font-size:.7em;vertical-align:super}
.cerbox{margin:12px 0}
.cerbox label{font-weight:700;color:var(--navy);display:block;margin-bottom:3px}
.cerbox textarea{width:100%;font:inherit;min-height:88px;padding:8px 10px;border:1.5px solid #8ea4bc;border-radius:4px;resize:vertical}
.cerbox .wc{font-size:.78rem;color:var(--muted);text-align:right}
.hotsel{margin-top:8px;font-weight:600;color:var(--navy)}

/* simulation */
canvas#simcv{width:100%;height:auto;display:block;border:2px solid var(--navy);border-radius:4px;background:#10233a;cursor:crosshair}
.modes{display:flex;gap:6px;margin:4px 0 10px}
.mode{border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:6px 18px;border-radius:20px;font-weight:600}
.mode.on{background:var(--navy);color:#fff}
.simread{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.simread div{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 8px;text-align:center}
.simread b{display:block;font-size:1.25rem;color:var(--navy)}
.simread span{font-size:.75rem;color:var(--muted)}
.simctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 0}
.simctl .btn{padding:7px 16px}
.sl{display:block;font-weight:600;color:var(--navy);min-width:220px;font-size:.92rem}
.sl input{display:block;width:100%;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend span i+i{margin-left:-2px}

/* footer nav */
.foot{height:62px;background:#fff;border-top:3px solid var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{width:34px;height:34px;border-radius:50%;border:2px solid #8ea4bc;background:#fff;color:var(--navy);font-weight:700;position:relative;padding:0}
.chip.done{background:#cfe3f7;border-color:var(--blue)}
.chip.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;background:var(--flag);border:2px solid #fff;border-radius:50%}
.flagbtn{background:#fff;border:1.5px solid var(--flag);color:#7a5600;border-radius:4px;padding:6px 12px;font-weight:600}
.flagbtn.on{background:var(--flag);color:#fff}

/* review + results */
.rvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.rvitem{border:1.5px solid #8ea4bc;border-radius:6px;padding:10px;background:#fff;text-align:left}
.rvitem.done{background:#e4effb;border-color:var(--blue)}
.rvitem.todo{background:#fff8e1;border-color:var(--flag)}
.rvitem b{display:block;color:var(--navy)}
.score{font-size:2.3rem;font-weight:700;color:var(--navy)}
.res{border:1.5px solid var(--line);border-left-width:8px;border-radius:5px;padding:12px 16px;margin:14px 0;background:#fff}
.res.good{border-left-color:var(--ok)}
.res.miss{border-left-color:var(--bad)}
.res.self{border-left-color:var(--blue)}
.res h4{margin:0 0 6px;color:var(--navy)}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px}
.tag.good{background:var(--okbg);color:var(--ok)}
.tag.miss{background:var(--badbg);color:var(--bad)}
.model{background:var(--pale);border-radius:5px;padding:10px 14px;margin-top:8px;font-size:.95rem}
.resp{white-space:pre-wrap;background:#fafafa;border:1px dashed #98a9bb;padding:6px 10px;border-radius:4px;margin:4px 0 8px;font-size:.95rem}
.checks label{display:block;margin:4px 0}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:48% 52%}
  .stim{border-right:none;border-bottom:3px solid var(--navy)}
  .screen{margin:10px;padding:20px}
  .foot{flex-wrap:wrap;height:auto;padding:6px}
  #root{height:calc(100% - 58px)}
}
@media print{
  body{background:#fff}
  .top,.foot,.noprint{display:none!important}
  #root{height:auto}
  .screen{border:none;margin:0;max-width:none;padding:0}
}

/* isotope additions */
.viewbox{background:#fff;border:2px solid var(--navy);border-radius:4px;padding:6px}
.status{margin:8px 0;padding:8px 12px;background:var(--hl);border:1px solid #e6cf7a;border-radius:4px;font-weight:600;color:#3d3200}
.tile{display:inline-block;border:2px solid var(--navy);border-radius:4px;padding:6px 16px;text-align:center;background:#fff;margin:4px 0 10px}
.tile .z{font-size:.85rem;text-align:left}.tile .s{font-size:1.9rem;font-weight:700;color:var(--navy);line-height:1}.tile .nm{font-size:.85rem}.tile .m{font-size:.95rem;font-weight:700}
.formula{background:var(--pale);border-left:6px solid var(--blue);padding:10px 14px;margin:8px 0 14px}
.sup{font-size:.7em;vertical-align:super}.sub{font-size:.7em;vertical-align:sub}
.modes{display:flex;gap:6px;margin:4px 0 10px}
.mode{border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:6px 18px;border-radius:20px;font-weight:600}
.mode.on{background:var(--navy);color:#fff}
.simread{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.simread div{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 8px;text-align:center}
.simread b{display:block;font-size:1.2rem;color:var(--navy)}
.simread span{font-size:.75rem;color:var(--muted)}
.simctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:10px 0}
.simctl .btn{padding:7px 16px}
.sl{display:block;font-weight:600;color:var(--navy);min-width:200px;font-size:.92rem}
.sl input{display:block;width:100%;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}



/* cell transport additions */
.calcrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.calcrow:last-child{border-bottom:none}
.calcrow .lab{flex:1;min-width:220px}
.calcrow input{width:90px;font:inherit;text-align:center;padding:6px;border:1.5px solid #6f89a6;border-radius:4px}
</style>
</head>
<body>

<div class="top">
  <h1>Cell Transport<small>CAST-style warm-up &bull; Passive, facilitated, and active transport &bull; 4 questions</small></h1>
  <div class="tools noprint" aria-label="Text size">
    <button onclick="fs(-1)" aria-label="Smaller text">A&minus;</button><button onclick="fs(1)" aria-label="Larger text">A+</button>
  </div>
</div>
<div id="root"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const MOLECULES=[
 {id:"o2",name:"Oxygen (O\u2082)",small:true,protein:false,path:"simple",color:"#4a90d9",note:"small and nonpolar \u2014 slips directly between the phospholipid tails"},
 {id:"co2",name:"Carbon dioxide (CO\u2082)",small:true,protein:false,path:"simple",color:"#8a8a8a",note:"small and nonpolar \u2014 slips directly between the phospholipid tails"},
 {id:"h2o",name:"Water (H\u2082O)",small:true,protein:false,path:"simple",color:"#3ab0c8",note:"small enough to cross directly, though special channel proteins called aquaporins speed this up in some cells"},
 {id:"glc",name:"Glucose",small:false,protein:true,path:"facilitated",color:"#3a9a4a",note:"too large and polar to cross the bilayer directly \u2014 needs a specific carrier protein shaped to fit it"},
 {id:"na",name:"Sodium ion (Na\u207A)",small:false,protein:true,path:"facilitated",color:"#8a5fb0",note:"charged \u2014 needs a channel protein to cross; moving it against its gradient instead needs the sodium-potassium pump (active transport)"},
 {id:"k",name:"Potassium ion (K\u207A)",small:false,protein:true,path:"facilitated",color:"#c77a2a",note:"charged \u2014 needs a channel protein to cross; moving it against its gradient instead needs the sodium-potassium pump (active transport)"}
];
const DIR_TABLE={
 simple:{with:{ok:true,energy:false,text:"Possible, no energy needed. Diffusion always moves a substance down its concentration gradient (high to low), so moving with the gradient is exactly what simple diffusion does on its own."},
         against:{ok:false,energy:false,text:"Not possible. Simple diffusion can only move a substance down its concentration gradient (high to low). Moving against the gradient here would require active transport."}},
 facilitated:{with:{ok:true,energy:false,text:"Possible, no energy needed. Like simple diffusion, facilitated diffusion only moves a substance down its concentration gradient \u2014 a protein just helps it across, it doesn't add energy."},
              against:{ok:false,energy:false,text:"Not possible. Even with a channel or carrier protein, facilitated diffusion still only moves a substance down its concentration gradient. Moving against the gradient here would require active transport."}},
 active:{with:{ok:true,energy:true,text:"Possible \u2014 but a pump isn't really needed here. Active transport pumps can move a substance in either direction, but they exist specifically to move things against the gradient. Moving with the gradient could happen by diffusion instead, at no energy cost."},
         against:{ok:true,energy:true,text:"Possible, but only with an input of energy (ATP) to force the substance from low to high concentration \u2014 this is exactly what the sodium-potassium pump does."}}
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* =========================================================
   QUESTIONS
   ========================================================= */
const QS=[
 {t:"table",tab:"diagram",label:"Table match",
  prompt:"Match each description to the type of transport it describes: simple diffusion, facilitated diffusion, or active transport. Use the Passage and the Diagram.",
  cols:[["simple","Simple diffusion"],["facilitated","Facilitated diffusion"],["active","Active transport"]],
  rows:[
   ["Moves a molecule directly through the phospholipid bilayer, with no protein needed","simple"],
   ["Moves a molecule through a protein channel or carrier, but still down its concentration gradient","facilitated"],
   ["Moves a molecule against its concentration gradient, using ATP","active"],
   ["Works for small, nonpolar molecules like oxygen and carbon dioxide","simple"],
   ["Lets glucose enter most cells, using a specific carrier protein, without using any energy","facilitated"],
   ["Used by the sodium-potassium pump to keep sodium low and potassium high inside a nerve cell","active"],
   ["Osmosis: water moving into a cell placed in a hypotonic solution, with no protein and no energy needed","simple"],
   ["Water moving out of a cell placed in a hypertonic solution, down water's own concentration gradient","simple"]
  ],
  why:"Simple diffusion needs no protein because the molecule is small and nonpolar enough to slip directly through the bilayer. Facilitated diffusion still moves down the concentration gradient like simple diffusion, but the molecule is too large or too polar to cross on its own, so it needs a channel or carrier protein \u2014 note that this protein does not add energy. Active transport is the only one of the three that moves a substance against its gradient, which is why it is the only one that requires ATP, as in the sodium-potassium pump. Osmosis is simply a special case of simple diffusion \u2014 water diffusing down its own concentration gradient \u2014 so it also needs no protein and no energy, whether water is moving into a cell (hypotonic solution) or out of one (hypertonic solution)."},

 {t:"calc",tab:"graph",label:"Read the graphs",
  prompt:"Use Graph 1, Graph 2, and Graph 3 to answer each question. Enter a number.",
  rows:[
   {label:"On Graph 1, at a concentration gradient of about 40, about what is the rate of facilitated diffusion?",key:67,tol:12,unit:"(rate)"},
   {label:"On Graph 1, at about what gradient value does the facilitated diffusion curve start to flatten out (reach a plateau)?",key:50,tol:18,unit:"(gradient)"},
   {label:"On Graph 2, about what percent of the original sodium is still inside the cell after 10 minutes of the pump running?",key:35,tol:12,unit:"%"},
   {label:"On Graph 2, about what percent of potassium is inside the cell after 10 minutes of the pump running?",key:85,tol:12,unit:"%"},
   {label:"On Graph 3, about what is an animal cell's relative volume (%) in a hypotonic solution?",key:145,tol:15,unit:"%"},
   {label:"On Graph 3, about what is a plant cell's relative volume (%) in that same hypotonic solution?",key:108,tol:12,unit:"%"}
  ],
  why:"Graph 1 shows that facilitated diffusion's rate rises quickly at first but levels off once the limited number of carrier proteins are all busy (around a gradient of 40 to 60), while simple diffusion keeps rising steadily because it isn't limited by proteins. Graph 2 shows the sodium-potassium pump at work: sodium inside the cell drops sharply over the first several minutes as it is pumped out, while potassium rises as it is pumped in \u2014 both against their own gradients, which is only possible because the pump uses ATP. Graph 3 shows that in a hypotonic solution, an animal cell swells a lot (around 145% of its normal volume, putting it at risk of bursting) while a plant cell swells only a little (around 108%) because its rigid cell wall holds it at a firm, turgid size instead of letting it keep expanding."},

 {t:"num",tab:"sim",simMode:"cross",label:"Enter a number (uses the simulation)",
  prompt:"Open the Simulation tab and choose <b>Cross the membrane</b>. Try all six molecules. How many of them need a protein to cross the membrane?",
  lo:2.5,hi:3.5,key:"3",unit:"(out of 6 molecules)",
  why:"Oxygen, carbon dioxide, and water are small enough (and, for the gases, nonpolar enough) to cross the bilayer directly with no protein. Glucose, sodium ions, and potassium ions are too large or too charged to cross on their own, so all three need a protein \u2014 that's 3 out of 6."},

 {t:"cer",tab:"data",label:"Constructed response (Claim, Evidence, Reasoning)",
  prompt:"A classmate says: \u201CDiffusion and active transport are basically the same thing, since both just move molecules across the membrane.\u201D Use the Data tables and Diagram to write a claim, evidence, and reasoning response explaining whether your classmate is correct.",
  ph:{c:"I disagree because ...",e:"Table 1 shows that ... The sodium-potassium pump ...",r:"Molecules move down their gradient on their own because ... but moving against the gradient requires ..."},
  model:{
   c:"I disagree. Diffusion and active transport are not the same, because they move substances in opposite directions relative to the concentration gradient, and only one of them needs energy.",
   e:"Table 1 shows that simple and facilitated diffusion both move a substance down its concentration gradient (high to low) and use no ATP, while active transport moves a substance against its gradient (low to high) and requires ATP. The sodium-potassium pump is an example: it keeps pumping sodium out and potassium in, against both of their gradients, using energy from ATP the whole time.",
   r:"Molecules naturally spread out from high to low concentration on their own, through random motion, so no energy is needed to move them that way \u2014 that's diffusion. Forcing a substance to build up where it is already concentrated works against that natural spreading out, so it takes an input of energy, which is why only active transport uses ATP."},
  checks:["Claim: disagrees, and says diffusion and active transport differ in direction relative to the gradient and in energy use.",
          "Evidence: cites Table 1's comparison (direction, protein, and ATP use) or the sodium-potassium pump moving ions against their gradients.",
          "Reasoning: explains that moving down the gradient happens on its own (no energy needed), while moving against the gradient requires an input of energy (ATP)."],
  kw:{claim:[/disagree|incorrect|not\s+(the\s+same|correct|true)|is\s+wrong/i,/differ|different|not\s+the\s+same|distinct|opposite/i],
      evidence:[/gradient/i,/atp|energy/i,/active\s+transport/i,/diffus/i,/sodium|potassium|na\+|k\+/i,/protein/i],
      reasoning:[/energy|atp/i,/gradient|concentration/i]}}
];

/* =========================================================
   STATE
   ========================================================= */
let screen="intro",cur=0,tab="passage",ans={},flagged=new Set(),studentName="",selfChecks=[false,false,false],fsize=17,cerRevised=false;
const sim={mode:"cross",molIdx:0,type:"simple",direction:"with",tonicity:"hypotonic",cellType:"animal"};
const TONICITY={
 hypotonic:{animal:{water:"in",vol:145,text:"Water moves into the cell (there is less solute, so more water, outside than in). An animal cell has no wall to hold it back, so it swells \u2014 and may burst (lysis) if this goes on too long."},
            plant:{water:"in",vol:108,text:"Water moves into the cell, but the rigid cell wall stops it from expanding too far. The cell becomes firm and turgid \u2014 this is actually the healthy, normal state for most plant cells."}},
 isotonic:{animal:{water:"none",vol:100,text:"The solute concentration inside and outside the cell is equal, so there is no net movement of water. The animal cell stays a normal size."},
           plant:{water:"none",vol:96,text:"With no net water movement, the plant cell is flaccid (not firm) rather than turgid \u2014 not damaged, but not at its healthiest, firmest state either."}},
 hypertonic:{animal:{water:"out",vol:65,text:"Water moves out of the cell (there is more solute, so less water, outside than in). The animal cell shrinks and shrivels (crenation)."},
             plant:{water:"out",vol:75,text:"Water moves out of the cell. The cytoplasm and membrane shrink away from the rigid cell wall, which stays the same size \u2014 this is called plasmolysis."}}
};

/* =========================================================
   DRAWING HELPERS
   ========================================================= */
function phospholipid(x,y,dir){
 return `<circle cx="${x}" cy="${y}" r="7" fill="#f0c419" stroke="#a8850a" stroke-width="1.5"/><line x1="${x}" y1="${y+dir*6}" x2="${x}" y2="${y+dir*26}" stroke="#a8850a" stroke-width="3"/>`;
}
function bilayer(W,topY,skipRanges){
 skipRanges=skipRanges||[];
 let s="";const step=26,n=Math.floor(W/step);
 for(let i=0;i<n;i++){
  const x=13+i*step;
  const skip=skipRanges.some(r=>x>r[0]&&x<r[1]);
  if(skip)continue;
  s+=phospholipid(x,topY,1);
  s+=phospholipid(x,topY+64,-1);
 }
 return s;
}
function molIcon(m,x,y,r){
 r=r||(m.small?11:15);
 return `<circle cx="${x}" cy="${y}" r="${r}" fill="${m.color}" stroke="#17365d" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="${m.small?9:10}" font-weight="700" text-anchor="middle" fill="#fff">${m.id==="na"?"Na\u207A":m.id==="k"?"K\u207A":m.id==="glc"?"Glc":m.id.toUpperCase()}</text>`;
}
function diagramSVG(){
 const W=700,H=260,topY=60;

function osmosisDiagramSVG(){

 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="An animal cell in hypotonic, isotonic, and hypertonic solutions: swelling, staying the same, and shrinking"><rect width="${W}" height="${H}" fill="#eaf3fb" stroke="#9db2c9"/>`;
 panels.forEach(([tonicity,cx])=>{
  const info=TONICITY[tonicity].animal,baseR=42,r=baseR*Math.sqrt(info.vol/100);

  g+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="#f6cf9e" stroke="#b5610e" stroke-width="3"/>`;
  if(info.water==="in"){
   g+=`<line x1="${cx-r-26}" y1="${cy}" x2="${(cx-r-4).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrO)"/><line x1="${cx+r+26}" y1="${cy}" x2="${(cx+r+4).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrO)"/>`;
  } else if(info.water==="out"){
   g+=`<line x1="${(cx-r-4).toFixed(1)}" y1="${cy}" x2="${cx-r-26}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrO)"/><line x1="${(cx+r+4).toFixed(1)}" y1="${cy}" x2="${cx+r+26}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrO)"/>`;
  }
  g+=`<text x="${cx}" y="${H-14}" font-size="11" text-anchor="middle" fill="#33475b">${info.water==="in"?"water in \u2014 swells":info.water==="out"?"water out \u2014 shrinks":"no net movement"}</text>`;
 });

function genChart(o){
 const W=o.w||600,H=o.h||300,L=60,R=18,T=o.legend?36:18,B=48;
 const X=v=>L+(v-o.xmin)/(o.xmax-o.xmin)*(W-L-R),Y=v=>H-B-(v-o.ymin)/(o.ymax-o.ymin)*(H-T-B);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.aria}"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
 for(let v=o.ymin;v<=o.ymax+1e-9;v+=o.ystep)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2eaf2"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end">${v}</text>`;
 for(let v=o.xmin;v<=o.xmax+1e-9;v+=o.xstep)g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="#eef4fa"/><text x="${X(v)}" y="${H-B+16}" font-size="11" text-anchor="middle">${v}</text>`;
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#33475b" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#33475b" stroke-width="2"/>`;
 g+=`<text x="${(L+W-R)/2}" y="${H-10}" font-size="12.5" font-weight="600" text-anchor="middle">${o.xlabel}</text>`;
 g+=`<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" font-size="12.5" font-weight="600" text-anchor="middle">${o.ylabel}</text>`;
 (o.series||[]).forEach(s=>{const pts=[];for(let v=o.xmin;v<=o.xmax+1e-9;v+=(o.xmax-o.xmin)/140)pts.push([v,s.fn(v)]);
  g+=`<polyline fill="none" stroke="${s.col}" stroke-width="3" points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(Math.max(o.ymin,Math.min(o.ymax,p[1]))).toFixed(1)).join(" ")}"/>`;});
 if(o.legend)(o.series||[]).forEach((s,i)=>{const lx=L+i*(o.legW||170);g+=`<line x1="${lx}" x2="${lx+22}" y1="18" y2="18" stroke="${s.col}" stroke-width="3.5"/><text x="${lx+28}" y="22" font-size="11.5">${s.name}</text>`;});
 return g+`</svg>`;
}
function gradientGraphSVG(){
 return genChart({xmin:0,xmax:100,xstep:20,ymin:0,ymax:100,ystep:20,xlabel:"Concentration gradient (steepness)",ylabel:"Rate of transport",legend:true,legW:190,
  series:[{name:"Simple diffusion",col:"#4a90d9",fn:x=>x},{name:"Facilitated diffusion",col:"#1f7a55",fn:x=>100*x/(15+x)}],
  aria:"Rate of transport versus concentration gradient: simple diffusion rises steadily, facilitated diffusion rises quickly then levels off"});
}
function pumpGraphSVG(){
 return genChart({xmin:0,xmax:20,xstep:2,ymin:0,ymax:100,ystep:20,xlabel:"Time (minutes)",ylabel:"Percent inside the cell (%)",legend:true,legW:190,
  series:[{name:"Sodium (Na\u207A)",col:"#8a5fb0",fn:t=>20+80*Math.exp(-t/6)},{name:"Potassium (K\u207A)",col:"#c77a2a",fn:t=>20+80*(1-Math.exp(-t/6))}],
  aria:"Sodium and potassium concentration inside the cell over time as the sodium-potassium pump runs: sodium falls, potassium rises"});
}
function tonicityGraphSVG(){
 const W=600,H=320,L=60,R=18,T=36,B=56;
 const items=[["Animal,\nhypotonic",145,"#4a90d9"],["Plant,\nhypotonic",108,"#3a9a4a"],["Animal,\nhypertonic",65,"#4a90d9"],["Plant,\nhypertonic",75,"#3a9a4a"]];
 const Y=v=>H-B-(v/160)*(H-T-B);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Relative cell volume by tonicity: animal cells swell more in hypotonic solution and shrink more in hypertonic solution than plant cells, whose rigid wall limits the change"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
 [0,40,80,120,160].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2eaf2"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end">${v}</text>`;});
 g+=`<line x1="${L}" y1="${Y(100)}" x2="${W-R}" y2="${Y(100)}" stroke="#8a6a00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(100)-5}" font-size="11" fill="#8a6a00" text-anchor="end">100% (isotonic baseline)</text>`;
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#33475b" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#33475b" stroke-width="2"/>`;
 g+=`<text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" font-size="12.5" font-weight="600" text-anchor="middle">Relative cell volume (%)</text>`;
 items.forEach((it,i)=>{const cx=L+(i+0.5)*((W-L-R)/4);
  g+=`<rect x="${cx-34}" y="${Y(it[1])}" width="68" height="${H-B-Y(it[1])}" fill="${it[2]}" opacity=".85"/><text x="${cx}" y="${Y(it[1])-8}" font-size="13" font-weight="700" text-anchor="middle">${it[1]}%</text>`;
  it[0].split("\n").forEach((line,li)=>{g+=`<text x="${cx}" y="${H-B+18+li*13}" font-size="11" text-anchor="middle">${line}</text>`;});
 });
 return g+`</svg>`;
}

function crossSVG(m){
 const W=340,H=190,topY=70;
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${m.name} crossing the membrane by ${m.path==="simple"?"simple diffusion, no protein":"facilitated diffusion, through a protein"}"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
 if(m.protein){
  g+=bilayer(W,topY,[[140,200]]);
  g+=`<rect x="140" y="${topY-10}" width="60" height="84" rx="14" fill="#bcd6f0" stroke="#1f5fa8" stroke-width="2.5"/><circle cx="170" cy="${topY+32}" r="15" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>`;
  g+=molIcon(m,170,topY+32);
  g+=`<text x="170" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#1f5fa8">Facilitated diffusion</text>`;
 } else {
  g+=bilayer(W,topY,[[160,178]]);
  g+=`<line x1="170" y1="${topY-14}" x2="170" y2="${topY+78}" stroke="${m.color}" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrC)"/>`;
  g+=molIcon(m,170,topY+32,9);
  g+=`<text x="170" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#33475b">Simple diffusion</text>`;
 }
 g+=`<defs><marker id="arrC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#33475b"/></marker></defs>`;
 return g+`</svg>`;
}
function directionSVG(type,dir){
 const W=340,H=190;
 const outside=dir==="with"?80:20, inside=dir==="with"?20:80;
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Attempting to move a substance ${dir} the gradient using ${type}"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
 g+=`<rect x="15" y="30" width="130" height="130" fill="#e8f0fa" opacity="${0.2+outside/125}"/><text x="80" y="20" font-size="12" font-weight="700" text-anchor="middle">Outside: ${outside}%</text>`;
 g+=`<rect x="195" y="30" width="130" height="130" fill="#e8f0fa" opacity="${0.2+inside/125}"/><text x="260" y="20" font-size="12" font-weight="700" text-anchor="middle">Inside: ${inside}%</text>`;
 const midColor=type==="simple"?"#c7d2dc":type==="facilitated"?"#bcd6f0":"#f6cf9e";
 const midStroke=type==="simple"?"#7c8fa0":type==="facilitated"?"#1f5fa8":"#b5610e";
 g+=`<rect x="150" y="20" width="40" height="150" fill="${midColor}" stroke="${midStroke}" stroke-width="2.5"/>`;
 if(type!=="simple")g+=`<circle cx="170" cy="95" r="14" fill="#fff" stroke="${midStroke}" stroke-width="2"/>`;

 const ax1=dir==="with"?100:240, ax2=dir==="with"?240:100;
 g+=`<line x1="${ax1}" y1="95" x2="${ax2}" y2="95" stroke="${res.ok?"#1b7f4b":"#b3261e"}" stroke-width="4" marker-end="url(#arrD)"/>`;
 g+=`<defs><marker id="arrD" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="${res.ok?"#1b7f4b":"#b3261e"}"/></marker></defs>`;
 g+=`<text x="170" y="185" font-size="26" font-weight="700" text-anchor="middle" fill="${res.ok?"#1b7f4b":"#b3261e"}">${res.ok?"\u2713":"\u2715"}</text>`;
 if(res.energy)g+=`<text x="260" y="175" font-size="11" font-weight="700" text-anchor="middle" fill="#8a6a00">uses ATP</text>`;
 return g+`</svg>`;
}
function osmosisSVG(tonicity,cellType){

 const baseR=48,r=baseR*Math.sqrt(info.vol/100);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${cap(cellType)} cell in a ${tonicity} solution: ${info.water==="in"?"water moving in":info.water==="out"?"water moving out":"no net water movement"}"><rect width="${W}" height="${H}" fill="#eaf3fb" stroke="#9db2c9"/>`;
 if(cellType==="plant"){
  const wr=baseR+16;
  g+=`<rect x="${cx-wr}" y="${cy-wr}" width="${wr*2}" height="${wr*2}" rx="12" fill="none" stroke="#2c7a2c" stroke-width="4"/><text x="${cx}" y="${cy-wr-8}" font-size="10.5" fill="#2c7a2c" text-anchor="middle">cell wall (fixed size)</text>`;
 }
 g+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${cellType==="plant"?"#bfe6c9":"#f6cf9e"}" stroke="${cellType==="plant"?"#1b7f4b":"#b5610e"}" stroke-width="3"/>`;
 if(info.water==="in"){
  g+=`<line x1="${(cx-r-30).toFixed(1)}" y1="${cy}" x2="${(cx-r-4).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrW)"/>`;
  g+=`<line x1="${(cx+r+30).toFixed(1)}" y1="${cy}" x2="${(cx+r+4).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrW)"/>`;
 } else if(info.water==="out"){
  g+=`<line x1="${(cx-r-4).toFixed(1)}" y1="${cy}" x2="${(cx-r-30).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrW)"/>`;
  g+=`<line x1="${(cx+r+4).toFixed(1)}" y1="${cy}" x2="${(cx+r+30).toFixed(1)}" y2="${cy}" stroke="#2a6fb5" stroke-width="3" marker-end="url(#arrW)"/>`;
 }
 g+=`<defs><marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a6fb5"/></marker></defs>`;
 g+=`<text x="${cx}" y="20" font-size="13" font-weight="700" text-anchor="middle" fill="#33475b">${cap(tonicity)} solution</text>`;
 g+=`<text x="${cx}" y="${H-8}" font-size="11" text-anchor="middle" fill="#33475b">${info.water==="in"?"water moving in":info.water==="out"?"water moving out":"no net water movement"}</text>`;

function setMol(i){sim.molIdx=+i;setTab("sim");}
function setType(t){sim.type=t;setTab("sim");}
function setDir(d){sim.direction=d;setTab("sim");}
function setTonicity(t){sim.tonicity=t;setTab("sim");}
function setCellType(c){sim.cellType=c;setTab("sim");}
function simMode(m){sim.mode=m;setTab("sim");}
function updateSim(){
 const v=$("#simview"),r=$("#simread");
 if(!v||!r)return;
 if(sim.mode==="cross"){
  const m=MOLECULES[sim.molIdx];
  v.innerHTML=crossSVG(m);
  r.innerHTML=`<div><b>${m.name}</b><span>molecule</span></div><div><b>${m.protein?"Yes":"No"}</b><span>needs a protein?</span></div><div><b>${cap(m.path)} diffusion</b><span>pathway</span></div><div><b>No</b><span>needs energy?</span></div>`;
  const st=$("#simstat");
  if(st)st.innerHTML=`<div class="status">${m.name} is ${m.note}.</div>`;
 } else if(sim.mode==="direction"){
  v.innerHTML=directionSVG(sim.type,sim.direction);
  const res=DIR_TABLE[sim.type][sim.direction];
  r.innerHTML=`<div><b>${cap(sim.type)}${sim.type!=="active"?" diffusion":" transport"}</b><span>transport type</span></div><div><b>${sim.direction==="with"?"With the gradient":"Against the gradient"}</b><span>direction attempted</span></div><div><b>${res.ok?"Possible":"Not possible"}</b><span>outcome</span></div><div><b>${res.energy?"Yes":"No"}</b><span>needs energy (ATP)?</span></div>`;
  const st=$("#simstat");
  if(st)st.innerHTML=`<div class="status">${res.text}</div>`;
 } else {
  const info=TONICITY[sim.tonicity][sim.cellType];
  v.innerHTML=osmosisSVG(sim.tonicity,sim.cellType);
  r.innerHTML=`<div><b>${cap(sim.cellType)} cell</b><span>cell type</span></div><div><b>${cap(sim.tonicity)}</b><span>solution</span></div><div><b>${info.water==="in"?"Into the cell":info.water==="out"?"Out of the cell":"No net movement"}</b><span>water moves</span></div><div><b>${info.vol}%</b><span>relative volume</span></div>`;
  const st=$("#simstat");
  if(st)st.innerHTML=`<div class="status">${info.text}</div>`;
 }
}
function simHTML(){
 const ctl = sim.mode==="cross" ?
  `<div class="modes" role="group" aria-label="Molecule">${MOLECULES.map((m,i)=>`<button class="mode ${sim.molIdx===i?"on":""}" onclick="setMol(${i})">${m.name}</button>`).join("")}</div>` :
  sim.mode==="direction" ?
  `<div class="modes" role="group" aria-label="Transport type"><button class="mode ${sim.type==="simple"?"on":""}" onclick="setType('simple')">Simple diffusion</button><button class="mode ${sim.type==="facilitated"?"on":""}" onclick="setType('facilitated')">Facilitated diffusion</button><button class="mode ${sim.type==="active"?"on":""}" onclick="setType('active')">Active transport</button></div>
   <div class="modes" role="group" aria-label="Direction"><button class="mode ${sim.direction==="with"?"on":""}" onclick="setDir('with')">With the gradient</button><button class="mode ${sim.direction==="against"?"on":""}" onclick="setDir('against')">Against the gradient</button></div>` :
  `<div class="modes" role="group" aria-label="Solution tonicity"><button class="mode ${sim.tonicity==="hypotonic"?"on":""}" onclick="setTonicity('hypotonic')">Hypotonic</button><button class="mode ${sim.tonicity==="isotonic"?"on":""}" onclick="setTonicity('isotonic')">Isotonic</button><button class="mode ${sim.tonicity==="hypertonic"?"on":""}" onclick="setTonicity('hypertonic')">Hypertonic</button></div>
   <div class="modes" role="group" aria-label="Cell type"><button class="mode ${sim.cellType==="animal"?"on":""}" onclick="setCellType('animal')">Animal cell</button><button class="mode ${sim.cellType==="plant"?"on":""}" onclick="setCellType('plant')">Plant cell</button></div>`;
 const cap2=sim.mode==="cross"?"Choose a molecule and see whether it needs a protein to cross the membrane.":sim.mode==="direction"?"Choose a transport type and a direction, and see whether that movement is possible and whether it needs energy.":"Choose a solution's tonicity and a cell type, and see which way water moves and what happens to the cell.";
 return `<h2>Simulation: Cell Transport</h2>
  <div class="modes" role="group" aria-label="Simulation mode"><button class="mode ${sim.mode==="cross"?"on":""}" onclick="simMode('cross')">Cross the membrane</button><button class="mode ${sim.mode==="direction"?"on":""}" onclick="simMode('direction')">Test a direction</button><button class="mode ${sim.mode==="osmosis"?"on":""}" onclick="simMode('osmosis')">Osmosis</button></div>
  <div class="viewbox" id="simview"></div>

  <div id="simstat"></div>

function stimHTML(){
 const tabs=[["passage","Passage"],["diagram","Diagram"],["graph","Graph"],["data","Data tables"],["sim","Simulation"]];
 let h=`<div class="tabs" role="tablist">`+tabs.map(t=>`<button class="tab" role="tab" aria-selected="${tab===t[0]}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")+`</div><div class="tabbody">`;
 if(tab==="passage") h+=`
  <div class="phen"><b>Phenomenon:</b> Spray a little perfume in one corner of a room, and eventually everyone in the room can smell it \u2014 no effort required. But a nerve cell spends a huge share of its entire energy budget constantly pumping sodium out and potassium in, even though sodium is already more concentrated outside the cell and potassium is already more concentrated inside.</div>
  <div class="passage">
  <h2>Cell Transport: Passive, Facilitated, and Active</h2>
  <p>The cell membrane is built mainly from a <mark>phospholipid bilayer</mark>: two layers of phospholipid molecules, each with a water-loving (hydrophilic) head facing outward and a water-fearing (hydrophobic) tail facing inward. This bilayer is <mark>selectively permeable</mark> \u2014 it lets some substances cross easily and blocks others. Embedded in the bilayer are <mark>proteins</mark> that help specific substances cross: channel proteins, carrier proteins, and pumps. (The membrane also has some carbohydrates attached to proteins and lipids, mainly used for cell recognition, but this warm-up focuses on the phospholipids and proteins that do the work of transport.)</p>
  <p><mark>Simple diffusion</mark> is the movement of small, nonpolar molecules \u2014 like oxygen and carbon dioxide \u2014 directly through the phospholipid bilayer, with no protein involved. Like all diffusion, it moves a substance down its <mark>concentration gradient</mark>, from where it is more concentrated to where it is less concentrated, and it requires no energy: it happens on its own as molecules move randomly and spread out.</p>
  <p><mark>Facilitated diffusion</mark> also moves a substance down its concentration gradient and uses no energy, but the substance \u2014 like glucose, or a charged ion \u2014 is too large or too polar to cross the bilayer on its own. It needs a specific channel or carrier protein shaped to let it through. The protein doesn't add energy; it just provides a path.</p>
  <p><mark>Active transport</mark> is different: it moves a substance <mark>against</mark> its concentration gradient, from low to high concentration. Because this works against the natural tendency of molecules to spread out, it always requires energy, usually from <mark>ATP</mark>, and it always uses a protein pump. The sodium-potassium pump is a classic example: using ATP, it continuously pumps sodium out of the cell and potassium into the cell, against both of their gradients.</p>
  <p><mark>Osmosis</mark> is a special, very common case of simple diffusion: it is just the diffusion of water across a selectively permeable membrane, so like simple diffusion it needs no protein and no energy. Water moves toward the side with more dissolved solute (and so less free water) \u2014 in other words, down water's own concentration gradient. Solutions are described by their <mark>tonicity</mark> relative to a cell: a <mark>hypotonic</mark> solution has less solute than the cell, so water moves into the cell; a <mark>hypertonic</mark> solution has more solute than the cell, so water moves out; an <mark>isotonic</mark> solution has equal solute, so there is no net water movement. An animal cell has no wall, so it can swell and burst in a hypotonic solution or shrivel in a hypertonic one; a plant cell's rigid cell wall keeps it from bursting, so it just becomes firm (turgid) in a hypotonic solution instead.</p>
  <div class="phen"><b>Real-world connection:</b> This is part of why sports drinks contain electrolytes like sodium and potassium. Heavy sweating flushes these ions out of the body, and nerve and muscle cells depend on their sodium-potassium pumps having enough of both ions on hand to keep working. Without enough sodium and potassium, those pumps can't maintain the gradients that nerve and muscle cells need, which is part of why dehydration can lead to cramping and fatigue. Osmosis matters in medicine too: IV fluids given in hospitals, such as 0.9% saline, are carefully matched to be isotonic with blood cells. An IV fluid that was too hypotonic or too hypertonic could make blood cells swell and burst or shrink and shrivel.</div>
  </div><div class="cap">Passage written for classroom use.</div>`;
 if(tab==="diagram") h+=`<figure><h2>Diagram 1: Three ways to cross the membrane</h2>${diagramSVG()}<figcaption class="cap">Simple diffusion needs no protein. Facilitated diffusion needs a protein but no energy. Active transport needs both a protein and energy (ATP), and is the only one that moves against the gradient.</figcaption></figure>
  <figure><h2>Diagram 2: Osmosis and tonicity</h2>${osmosisDiagramSVG()}<figcaption class="cap">In a hypotonic solution, water moves into the cell. In an isotonic solution, there is no net movement. In a hypertonic solution, water moves out.</figcaption></figure>`;
 if(tab==="graph") h+=`<figure><h2>Graph 1: Rate of transport vs. concentration gradient</h2>${gradientGraphSVG()}<figcaption class="cap">Simple diffusion's rate keeps climbing as the gradient gets steeper. Facilitated diffusion's rate levels off once the limited number of carrier proteins are all busy.</figcaption></figure>
  <figure><h2>Graph 2: The sodium-potassium pump over time</h2>${pumpGraphSVG()}<figcaption class="cap">As the pump runs, sodium inside the cell falls and potassium inside the cell rises \u2014 both against their own gradients.</figcaption></figure>
  <figure><h2>Graph 3: Relative cell volume by tonicity</h2>${tonicityGraphSVG()}<figcaption class="cap">In a hypotonic solution, an animal cell swells much more than a plant cell, whose rigid wall limits how far it can expand. Both shrink in a hypertonic solution.</figcaption></figure>`;
 if(tab==="data") h+=`
  <h2>Table 1: Comparing the three transport types</h2>
  <table class="data"><tr><th></th><th>Simple diffusion</th><th>Facilitated diffusion</th><th>Active transport</th></tr>
  <tr><td>Direction</td><td>Down the gradient</td><td>Down the gradient</td><td>Against the gradient</td></tr>
  <tr><td>Needs a protein?</td><td>No</td><td>Yes</td><td>Yes</td></tr>
  <tr><td>Needs energy (ATP)?</td><td>No</td><td>No</td><td>Yes</td></tr>
  <tr><td>Example</td><td>O\u2082 and CO\u2082 crossing the membrane</td><td>Glucose entering a cell</td><td>Sodium-potassium pump</td></tr>
  </table>
  <h2>Table 2: What the membrane is made of</h2>
  <table class="data"><tr><th>Component</th><th>Role in transport</th></tr>
  <tr><td>Phospholipids</td><td>Form the bilayer itself: hydrophilic heads face the water on both sides, hydrophobic tails face each other in the middle. This is what makes the membrane a barrier in the first place.</td></tr>
  <tr><td>Channel and carrier proteins</td><td>Embedded in the bilayer; provide a path for specific molecules that can't cross on their own (facilitated diffusion). Use no energy.</td></tr>
  <tr><td>Pump proteins</td><td>Embedded in the bilayer; use ATP to move a substance against its gradient (active transport).</td></tr>
  <tr><td>Carbohydrates <span class="cap">(not the focus here)</span></td><td>Attach to some proteins and lipids on the outside of the membrane; mainly used for cell recognition, not for transport.</td></tr>
  </table>
  <h2>Table 3: Osmosis and tonicity</h2>
  <table class="data"><tr><th>Solution</th><th>Water moves</th><th>Animal cell</th><th>Plant cell</th></tr>
  <tr><td>Hypotonic (less solute outside)</td><td>Into the cell</td><td>Swells \u2014 may burst (lysis)</td><td>Swells until turgid; wall prevents bursting</td></tr>
  <tr><td>Isotonic (equal solute)</td><td>No net movement</td><td>Normal</td><td>Flaccid (not firm)</td></tr>
  <tr><td>Hypertonic (more solute outside)</td><td>Out of the cell</td><td>Shrinks (crenation)</td><td>Cytoplasm shrinks from wall (plasmolysis)</td></tr>
  </table>
  <div class="formula"><b>Key relationship</b><br>Down the gradient, no protein needed \u2192 simple diffusion, no energy.<br>Down the gradient, but too big or too polar \u2192 facilitated diffusion (needs a protein), no energy.<br>Against the gradient \u2192 active transport (needs a protein and ATP).<br>Osmosis is simple diffusion of water: down water's own gradient, no protein, no energy.</div>`;
 if(tab==="sim") h+=simHTML();
 return h+`</div>`;
}

/* =========================================================
   QUESTION RENDERING
   ========================================================= */
function isAnswered(i){const q=QS[i],a=ans[i];
 if(a===undefined||a===null)return false;
 if(q.t==="table")return a.filter(x=>x).length===q.rows.length;
 if(q.t==="calc")return q.rows.every((r,k)=>a[k]!==undefined&&String(a[k]).trim()!=="");
 if(q.t==="num")return String(a).trim()!=="";
 if(q.t==="cer")return !!(a.c||a.e||a.r);
 return true;}
function qHTML(i){
 const q=QS[i],a=ans[i];
 let h=`<div class="qbody"><div><span class="qnum">${i+1}</span><b>Question ${i+1} of ${QS.length}</b></div><div class="qtype">${q.label}</div><div class="prompt">${q.prompt}</div>`;
 if(q.t==="table"){
  h+=`<table class="match"><tr><th>Compared with each other</th>${q.cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr>`+
  q.rows.map((r,k)=>`<tr><td>${r[0]}</td>`+q.cols.map(c=>`<td><input type="radio" name="r${k}" aria-label="${c[1]}" ${a&&a[k]===c[0]?"checked":""} onchange="setTable(${k},'${c[0]}')"></td>`).join("")+`</tr>`).join("")+`</table>`;
 }
 if(q.t==="calc"){
  h+=`<div class="hint">Use the Graph tab \u2014 Graph 1 (gradient), Graph 2 (the pump over time), and Graph 3 (tonicity).</div>`+
  q.rows.map((r,k)=>`<div class="calcrow"><div class="lab">${r.label}</div><input inputmode="decimal" aria-label="${r.label}" value="${a&&a[k]!==undefined?esc(a[k]):""}" oninput="setCalc(${k},this.value)"> <span class="cap">${r.unit}</span></div>`).join("");
 }
 if(q.t==="num"){
  h+=`<div class="hint">Tip: use the <b>Cross the membrane</b> mode in the simulation.</div><p class="inline"><input style="width:110px" aria-label="answer" inputmode="decimal" value="${a!==undefined?esc(a):""}" oninput="setNum(this.value)"> ${q.unit}</p>`;
 }
 if(q.t==="cer"){
  const v=a||{c:"",e:"",r:""};
  h+=`<div class="hint">Use the <b>Data tables</b> and <b>Diagram</b> tabs. Write in complete sentences.</div>
  <div class="cerbox"><label for="cc">Claim</label><textarea id="cc" oninput="setCER('c',this.value)" onpaste="return false" placeholder="${q.ph.c}">${esc(v.c)}</textarea></div>
  <div class="cerbox"><label for="ce">Evidence</label><textarea id="ce" oninput="setCER('e',this.value)" onpaste="return false" placeholder="${q.ph.e}">${esc(v.e)}</textarea></div>
  <div class="cerbox"><label for="cr">Reasoning</label><textarea id="cr" oninput="setCER('r',this.value)" onpaste="return false" placeholder="${q.ph.r}">${esc(v.r)}</textarea></div>`;
 }
 return h+`</div>`;
}
function setTable(r,v){const a=ans[cur]||new Array(QS[cur].rows.length).fill(null);a[r]=v;ans[cur]=a;refreshChips()}
function setCalc(k,v){const a=Array.isArray(ans[cur])?ans[cur]:new Array(QS[cur].rows.length).fill(undefined);a[k]=v;ans[cur]=a;refreshChips()}
function setNum(v){ans[cur]=v;refreshChips()}
function setCER(k,v){const a=ans[cur]||{c:"",e:"",r:""};a[k]=v;ans[cur]=a;refreshChips()}
function refreshChips(){const c=$("#chips");if(c)c.innerHTML=chipsHTML()}

/* =========================================================
   NAVIGATION / SCREENS
   ========================================================= */
function setTab(t){tab=t;const s=$("#stim");if(s){s.innerHTML=stimHTML();}if(t==="sim")updateSim();}
function go(i){cur=i;tab=QS[i].tab;if(QS[i].simMode)sim.mode=QS[i].simMode;screen="test";render()}
function next(){if(cur<QS.length-1)go(cur+1);else openReview()}
function prev(){if(cur>0)go(cur-1)}
function toggleFlag(){flagged.has(cur)?flagged.delete(cur):flagged.add(cur);render(true)}
function openReview(){screen="review";render()}
function submitAll(){autoCheckCER();screen="results";window.scrollTo(0,0);render()}
function reviseCER(){if(cerRevised)return;cur=QS.findIndex(q=>q.t==="cer");tab=QS[cur].tab;screen="reviseCER";render();window.scrollTo(0,0);}
function saveRevision(){cerRevised=true;autoCheckCER();screen="results";render();window.scrollTo(0,0);}
function autoCheckCER(){
 const cerIdx=QS.findIndex(q=>q.t==="cer"),kw=QS[cerIdx].kw,a=ans[cerIdx]||{c:"",e:"",r:""};
 const all=((a.c||"")+" "+(a.e||"")+" "+(a.r||"")).toLowerCase(),c=(a.c||"").toLowerCase();
 const claimOK=kw.claim[0].test(c)&&kw.claim[1].test(all);
 const evidenceOK=kw.evidence.filter(p=>p.test(all)).length>=2;
 const reasoningOK=kw.reasoning[0].test(all)&&kw.reasoning[1].test(all);
 selfChecks=[claimOK,evidenceOK,reasoningOK];
}
function fs(d){fsize=Math.min(24,Math.max(13,fsize+d*2));document.documentElement.style.setProperty("--fs",fsize+"px")}
function startTest(){studentName=($("#nm")||{value:""}).value.trim();go(0)}
function chipsHTML(){
 return QS.map((q,i)=>`<button class="chip ${i===cur?"cur":""} ${isAnswered(i)?"done":""} ${flagged.has(i)?"flag":""}" onclick="go(${i})" aria-label="Question ${i+1}${isAnswered(i)?", answered":""}${flagged.has(i)?", flagged":""}">${i+1}</button>`).join("");
}
function introHTML(){
 return `<div class="screen">
  <h2>Cell Transport: Passive, Facilitated, and Active</h2>
  <p>This is a short warm-up (about 10 to 15 minutes) that works like a computer-based science test. Read the passage, study the diagram, graphs, and data, and run the simulation. Then answer ${QS.length} questions.</p>
  <div class="phen"><b>Driving question:</b> Why can a molecule of oxygen cross a cell membrane completely on its own, while a nerve cell has to spend a huge share of its energy budget just to move sodium and potassium across the same membrane?</div>
  <h3>Directions</h3>
  <ul>
   <li>Use the tabs on the left (Passage, Diagram, Graph, Data tables, Simulation) to find evidence.</li>
   <li>Answer on the right. Use the numbered circles at the bottom to move between questions. Flag a question to come back to it.</li>
   <li>Question 2 asks you to read values off the graphs. Question ${QS.length} asks for a written Claim, Evidence, and Reasoning response.</li>
   <li>When you finish, choose <b>Review and submit</b> to see your score and an explanation for each question.</li>
  </ul>
  <div class="namebox"><label for="nm"><b>Name</b> (optional, prints on your results)</label><br><input id="nm" autocomplete="off"></div>
  <button class="btn" onclick="startTest()">Begin warm-up</button>
 </div>`;
}
function testHTML(){
 return `<div class="app">
  <section class="stim" id="stim" aria-label="Stimulus">${stimHTML()}</section>
  <section class="qp" id="qp" aria-label="Question">${qHTML(cur)}</section>
 </div>
 <div class="foot">
  <div><button class="btn ghost" onclick="prev()" ${cur===0?"disabled":""}>Previous</button></div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center">
    <button class="flagbtn ${flagged.has(cur)?"on":""}" onclick="toggleFlag()">${flagged.has(cur)?"Flagged":"Flag for review"}</button>
    <div class="chips" id="chips">${chipsHTML()}</div>
  </div>
  <div><button class="btn" onclick="next()">${cur===QS.length-1?"Review and submit":"Next"}</button></div>
 </div>`;
}
function reviseCERHTML(){
 return `<div class="app">
  <section class="stim" id="stim" aria-label="Stimulus">${stimHTML()}</section>
  <section class="qp" id="qp" aria-label="Question">${qHTML(cur)}</section>
 </div>
 <div class="foot">
  <div></div>
  <div style="text-align:center"><p class="small" style="margin:0"><b>Revising your response.</b> This is your only chance to change it.</p></div>
  <div><button class="btn" onclick="saveRevision()">Save revision and return to results</button></div>
 </div>`;
}
function reviewHTML(){
 const un=QS.map((q,i)=>i).filter(i=>!isAnswered(i));
 return `<div class="screen">
  <h2>Review your answers</h2>
  <p>${un.length?`You have <b>${un.length}</b> unanswered question${un.length>1?"s":""}: ${un.map(i=>i+1).join(", ")}.`:"All questions have an answer."} Select a question to go back to it.</p>
  <div class="rvlist">${QS.map((q,i)=>`<button class="rvitem ${isAnswered(i)?"done":"todo"}" onclick="go(${i})"><b>Question ${i+1}${flagged.has(i)?" (flagged)":""}</b>${isAnswered(i)?"Answered":"Not answered"}</button>`).join("")}</div>
  <button class="btn" onclick="submitAll()">Submit and see results</button>
  <button class="btn ghost" onclick="go(QS.length-1)" style="margin-left:8px">Back to task</button>
 </div>`;
}

/* =========================================================
   SCORING + RESULTS
   ========================================================= */
function score(i){
 const q=QS[i],a=ans[i];
 if(a===undefined||a===null)return 0;
 if(q.t==="table")return q.rows.every((r,k)=>a[k]===r[1])?1:0;
 if(q.t==="calc")return q.rows.every((r,k)=>{const n=parseFloat(a[k]);return !isNaN(n)&&Math.abs(n-r.key)<=r.tol;})?1:0;
 if(q.t==="num"){const n=parseFloat(a);return(!isNaN(n)&&n>=q.lo&&n<=q.hi)?1:0;}
 return 0;
}
function yourText(i){
 const q=QS[i],a=ans[i];
 if(a===undefined||a===null)return "No answer";
 if(q.t==="table")return q.rows.map((r,k)=>r[0]+" \u2192 "+(a[k]||"none")).join("<br>");
 if(q.t==="calc")return q.rows.map((r,k)=>r.label+": "+(a[k]!==undefined&&a[k]!==""?esc(a[k]):"blank")+" "+r.unit).join("<br>");
 if(q.t==="num")return esc(a)+" "+q.unit;
 return "";
}
function keyText(i){
 const q=QS[i];
 if(q.t==="table")return q.rows.map(r=>r[0]+" \u2192 "+r[1]).join("<br>");
 if(q.t==="calc")return q.rows.map(r=>r.label+": about "+r.key+" "+r.unit).join("<br>");
 if(q.t==="num")return q.key+" "+q.unit;
 return "";
}
function toggleSelf(k){selfChecks[k]=!selfChecks[k];const n=selfChecks.filter(Boolean).length;$("#cerscore").textContent=n;$("#totalscore").textContent=autoTotal()+n;}
function autoTotal(){let t=0;QS.forEach((q,i)=>{if(q.t!=="cer")t+=score(i)});return t}
function resultsHTML(){
 const auto=autoTotal(),autoMax=QS.filter(q=>q.t!=="cer").length,cerIdx=QS.findIndex(q=>q.t==="cer"),cq=QS[cerIdx],ca=ans[cerIdx]||{c:"",e:"",r:""};
 const n=selfChecks.filter(Boolean).length;
 let h=`<div class="screen">
  <h2>Results${studentName?": "+esc(studentName):""}</h2>
  <div>Questions 1\u2013${autoMax} (scored automatically): <span class="score">${auto} / ${autoMax}</span></div>
  <div>Question ${QS.length} (Claim, Evidence, Reasoning; auto-checked from keywords): <b><span id="cerscore">${n}</span> / 3</b></div>
  <div>Total: <b><span id="totalscore">${auto+n}</span> / ${autoMax+3}</b></div>
  <p class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button></p>`;
 QS.forEach((q,i)=>{
  if(q.t==="cer")return;
  const ok=score(i)===1;
  h+=`<div class="res ${ok?"good":"miss"}"><h4>Question ${i+1}<span class="tag ${ok?"good":"miss"}">${ok?"Correct":"Not yet"}</span></h4>
    <div><b>Your answer:</b><br>${yourText(i)}</div>
    ${ok?"":`<div style="margin-top:6px"><b>Correct answer:</b><br>${keyText(i)}</div>`}
    <div class="model" style="margin-top:8px">${q.why}</div></div>`;
 });
 h+=`<div class="res self"><h4>Question ${QS.length}: Claim, Evidence, Reasoning</h4>
   <div><b>Your claim:</b></div><div class="resp">${esc(ca.c||"(blank)")}</div>
   <div><b>Your evidence:</b></div><div class="resp">${esc(ca.e||"(blank)")}</div>
   <div><b>Your reasoning:</b></div><div class="resp">${esc(ca.r||"(blank)")}</div>
   <div class="model" oncopy="return false" style="user-select:none"><b>Model response</b><br><b>Claim:</b> ${cq.model.c}<br><b>Evidence:</b> ${cq.model.e}<br><b>Reasoning:</b> ${cq.model.r}</div>
   <p><b>Auto-checked.</b> These boxes were checked automatically based on keywords and numbers in your response (not a full reading). Compare your response to the model and adjust any box that isn't right.</p>
   <div class="checks">${cq.checks.map((c,k)=>`<label><input type="checkbox" ${selfChecks[k]?"checked":""} onchange="toggleSelf(${k})"> ${c}</label>`).join("")}</div>
   ${cerRevised?`<p class="small" style="margin-top:10px"><b>You have used your one revision for this response.</b></p>`:`<p class="noprint" style="margin-top:10px"><button class="btn ghost" onclick="reviseCER()">Revise your answer (one chance)</button></p>`}
   </div>`;
 return h+`</div>`;
}

/* =========================================================
   RENDER
   ========================================================= */
function render(keepScroll){
 const root=$("#root");
 let sy=0,qy=0;
 if(keepScroll){const s=$("#stim"),q=$("#qp");if(s)sy=s.scrollTop;if(q)qy=q.scrollTop;}
 root.innerHTML=screen==="intro"?introHTML():screen==="test"?testHTML():screen==="reviseCER"?reviseCERHTML():screen==="review"?reviewHTML():resultsHTML();
 if(keepScroll){const s=$("#stim"),q=$("#qp");if(s)s.scrollTop=sy;if(q)q.scrollTop=qy;}
 if((screen==="test"||screen==="reviseCER")&&tab==="sim")updateSim();
 root.style.overflow=(screen==="test"||screen==="reviseCER")?"hidden":"auto";
}
render();

</script>
</body>
</html>
