<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photosynthesis &amp; Cellular Respiration: CAST-Style Practice Task</title>
<style>
:root{
 --navy:#17365d; --blue:#2a6fb5; --pale:#eef4fa; --line:#c5d3e2; --ink:#1c2733; --muted:#586878;
 --ok:#1b7f4b; --okbg:#e6f4ec; --bad:#b3261e; --badbg:#fbeceb; --flag:#d99a00; --paper:#fff; --hl:#fff3c4;
 --fs:17px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#dfe7f0;font-size:var(--fs);line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #f2b705;outline-offset:2px}

.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px}
.top h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.2px}
.top small{display:block;font-weight:400;color:#b8cbe2;font-size:.78rem}
.tools button{background:transparent;color:#fff;border:1px solid #6d8bb0;border-radius:4px;padding:3px 10px;margin-left:6px}
.tools button:hover{background:#25497a}

#root{height:calc(100% - 58px)}

.screen{max-width:860px;margin:26px auto;background:var(--paper);border:1px solid var(--line);padding:30px 36px;border-radius:4px}
.screen h2{margin:0 0 6px;color:var(--navy);font-size:1.6rem}
.screen h3{color:var(--navy);margin:22px 0 6px;font-size:1.1rem}
.phen{background:var(--pale);border-left:6px solid var(--blue);padding:14px 18px;margin:16px 0}
.phen b{color:var(--navy)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:10px 22px;font-weight:600}
.btn:hover{background:#215c98}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--pale)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.namebox{margin:14px 0}
.namebox input{font:inherit;padding:8px 10px;border:1.5px solid #8ea4bc;border-radius:4px;width:280px;max-width:100%}
.namebox .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.namebox .fld{display:flex;flex-direction:column;gap:4px}
.namebox .fld label{font-size:.85rem;color:var(--muted)}
.namebox .fld input{width:200px}
.namebox .fld.pd input{width:80px}
.namebox .err{color:var(--bad);font-size:.88rem;margin-top:8px;display:none}
.sheetbox{font-size:.9rem;color:var(--muted);margin-top:6px}

.app{display:grid;grid-template-columns:1.12fr 1fr;height:calc(100% - 62px)}
.stim,.qp{overflow:auto;padding:0}
.stim{background:#f6f9fc;border-right:3px solid var(--navy)}
.qp{background:var(--paper)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:#e3ecf5;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:none;background:#cfdcea;color:var(--navy);padding:7px 14px;border-radius:5px 5px 0 0;font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:#fff;border-color:var(--navy);border-bottom:2px solid #fff;margin-bottom:-1px}
.tabbody{padding:18px 22px 40px}
.tabbody h2{font-size:1.1rem;color:var(--navy);margin:0 0 8px}
.passage p{font-family:Georgia,"Times New Roman",serif;font-size:1.02em;line-height:1.62;margin:0 0 12px;max-width:66ch}
.passage mark{background:var(--hl)}
.cap{font-size:.85rem;color:var(--muted);margin-top:6px}
figure{margin:0}
svg text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
table.data{border-collapse:collapse;width:100%;background:#fff;font-size:.93rem;margin:6px 0 16px}
table.data th,table.data td{border:1px solid #9db2c9;padding:6px 9px;text-align:left;vertical-align:top}
table.data th{background:#dbe6f2;color:var(--navy)}

.qbody{padding:18px 24px 40px}
.qnum{font-weight:700;color:#fff;background:var(--navy);display:inline-block;padding:2px 10px;border-radius:3px;margin-right:8px}
.qtype{font-size:.82rem;color:var(--muted);margin:4px 0 10px}
.prompt{font-size:1.02em;margin:10px 0 14px}
.hint{background:var(--hl);border:1px solid #e6cf7a;border-radius:4px;padding:6px 10px;font-size:.88rem;margin-bottom:12px}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #b7c7d9;border-radius:6px;padding:10px 12px;margin:8px 0;cursor:pointer;background:#fff}
label.opt:hover{background:var(--pale)}
label.opt.sel{border-color:var(--blue);background:#e4effb}
label.opt input{margin-top:5px;transform:scale(1.2)}
.eq{background:var(--pale);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:1.05rem;margin:10px 0;line-height:2.4}
.eq input{font:inherit;width:88px;text-align:center;padding:4px;border:1.5px solid #6f89a6;border-radius:4px}
.sub{font-size:.7em;vertical-align:sub}
.cerbox{margin:12px 0}
.cerbox label{font-weight:700;color:var(--navy);display:block;margin-bottom:3px}
.cerbox textarea{width:100%;font:inherit;min-height:88px;padding:8px 10px;border:1.5px solid #8ea4bc;border-radius:4px;resize:vertical}

.viewbox{background:#fff;border:2px solid var(--navy);border-radius:4px;padding:6px}
.status{margin:8px 0;padding:8px 12px;background:var(--hl);border:1px solid #e6cf7a;border-radius:4px;font-weight:600;color:#3d3200}
.formula{background:var(--pale);border-left:6px solid var(--blue);padding:10px 14px;margin:8px 0 14px}
.modes{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.mode{border:1.5px solid var(--navy);background:#fff;color:var(--navy);padding:6px 18px;border-radius:20px;font-weight:600}
.mode.on{background:var(--navy);color:#fff}
.simread{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.simread div{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 8px;text-align:center}
.simread b{display:block;font-size:1.2rem;color:var(--navy)}
.simread span{font-size:.75rem;color:var(--muted)}

.foot{height:62px;background:#fff;border-top:3px solid var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{width:34px;height:34px;border-radius:50%;border:2px solid #8ea4bc;background:#fff;color:var(--navy);font-weight:700;position:relative;padding:0}
.chip.done{background:#cfe3f7;border-color:var(--blue)}
.chip.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.flag::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;background:var(--flag);border:2px solid #fff;border-radius:50%}
.flagbtn{background:#fff;border:1.5px solid var(--flag);color:#7a5600;border-radius:4px;padding:6px 12px;font-weight:600}
.flagbtn.on{background:var(--flag);color:#fff}

.rvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.rvitem{border:1.5px solid #8ea4bc;border-radius:6px;padding:10px;background:#fff;text-align:left}
.rvitem.done{background:#e4effb;border-color:var(--blue)}
.rvitem.todo{background:#fff8e1;border-color:var(--flag)}
.rvitem b{display:block;color:var(--navy)}
.score{font-size:2.3rem;font-weight:700;color:var(--navy)}
.res{border:1.5px solid var(--line);border-left-width:8px;border-radius:5px;padding:12px 16px;margin:14px 0;background:#fff}
.res.good{border-left-color:var(--ok)}
.res.miss{border-left-color:var(--bad)}
.res.self{border-left-color:var(--blue)}
.res h4{margin:0 0 6px;color:var(--navy)}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px}
.tag.good{background:var(--okbg);color:var(--ok)}
.tag.miss{background:var(--badbg);color:var(--bad)}
.model{background:var(--pale);border-radius:5px;padding:10px 14px;margin-top:8px;font-size:.95rem}
.resp{white-space:pre-wrap;background:#fafafa;border:1px dashed #98a9bb;padding:6px 10px;border-radius:4px;margin:4px 0 8px;font-size:.95rem}
.checks label{display:block;margin:4px 0}

@media (max-width:900px){
 .app{grid-template-columns:1fr;grid-template-rows:48% 52%}
 .stim{border-right:none;border-bottom:3px solid var(--navy)}
 .screen{margin:10px;padding:20px}
 .foot{flex-wrap:wrap;height:auto;padding:6px}
 #root{height:calc(100% - 58px)}
}
@media print{
 body{background:#fff}
 .top,.foot,.noprint{display:none!important}
 #root{height:auto}
 .screen{border:none;margin:0;max-width:none;padding:0}
}
</style>

<body>

<div class="top">
 <h1>Photosynthesis &amp; Cellular Respiration<small>CAST-style warm-up &bull; How the two processes are related &bull; 4 questions</small></h1>
 <div class="tools noprint" aria-label="Text size">
   <button onclick="fs(-1)" aria-label="Smaller text">A&minus;</button><button onclick="fs(1)" aria-label="Larger text">A+</button>
 </div>
</div>
<div id="root"></div>

<script src="sheets-config.js"></script>
<script>
const SHEETS_ACTIVITY_NAME="Photosynthesis & Respiration Connection Warm-Up";
/* =========================================================
  DATA
  ========================================================= */
const TRACE={
co2:{name:"Carbon dioxide (CO₂)",producedBy:"cellular respiration",usedBy:"photosynthesis",
     note:"Cellular respiration releases CO₂ as a waste product when it breaks down glucose. Photosynthesis then uses that same CO₂ as a reactant to build new glucose."},
o2:{name:"Oxygen (O₂)",producedBy:"photosynthesis",usedBy:"cellular respiration",
    note:"Photosynthesis releases O₂ as a byproduct while building glucose. Cellular respiration then uses that same O₂ to help break glucose back down."},
glc:{name:"Glucose (C₆H₁₂O₆)",producedBy:"photosynthesis",usedBy:"cellular respiration",
     note:"Photosynthesis builds glucose to store captured light energy. Cellular respiration then breaks that glucose apart to release the stored energy."},
h2o:{name:"Water (H₂O)",producedBy:"cellular respiration",usedBy:"photosynthesis",
     note:"Cellular respiration produces water as a waste product. Photosynthesis uses water as a reactant, splitting it apart to help release oxygen."},
atp:{name:"ATP",producedBy:"cellular respiration",usedBy:"nearly every activity in the cell",
     note:"ATP is made only by cellular respiration, not by photosynthesis. Photosynthesis makes glucose (stored energy); only respiration converts that stored energy into ATP the cell can actually use."}
};
const DAYNIGHT={
day:{photo:80,resp:20,netO2:60,netCO2:-60,dominant:"Both processes are running \u2014 photosynthesis just outpaces respiration",
     text:"In sunlight, the plant's cells are doing both processes at the same time. Photosynthesis (rate 80) pulls in CO\u2082 and releases O\u2082. At the very same time, cellular respiration (rate 20) never stops \u2014 it is pulling in some O\u2082 and releasing some CO\u2082, just like it does at night. Because photosynthesis is so much faster, the net result visible from outside the plant is O\u2082 leaving and CO\u2082 entering, but respiration is genuinely still happening underneath that net exchange."},
night:{photo:0,resp:20,netO2:-20,netCO2:20,dominant:"Cellular respiration only \u2014 photosynthesis has stopped completely",
     text:"Without light, photosynthesis stops (rate 0), so respiration's O\u2082-in, CO\u2082-out exchange (rate 20) is no longer being masked by photosynthesis running the other way. So at night the plant is a net consumer of oxygen and a net producer of carbon dioxide \u2014 the reverse of a sunny day."}
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");

/* =========================================================
  QUESTIONS
  ========================================================= */
const QS=[
{t:"mc",tab:"diagram",label:"Multiple choice",
 prompt:"Which statement correctly describes the relationship between the reactants and products of photosynthesis and cellular respiration? Use the Passage and Diagram 1.",
 options:[
  {id:"a",text:"They use completely different molecules, so the two processes have nothing in common."},
  {id:"b",text:"The products of photosynthesis (glucose and oxygen) are the reactants of cellular respiration, and the products of cellular respiration (carbon dioxide and water) are the reactants of photosynthesis."},
  {id:"c",text:"Both processes release ATP as their main product."},
  {id:"d",text:"Photosynthesis happens in the mitochondria, while cellular respiration happens in the chloroplasts."}
 ],
 correct:"b",
 why:"Diagram 1 shows the two processes forming a cycle: photosynthesis makes glucose and oxygen, which cellular respiration then uses as reactants, while cellular respiration makes carbon dioxide and water, which photosynthesis then uses as reactants. Only cellular respiration produces ATP, and the organelles are the reverse of choice D \u2014 photosynthesis happens in chloroplasts, and cellular respiration happens in mitochondria."},

{t:"mc",tab:"sim",simMode:"daynight",label:"Multiple choice (uses the simulation)",
 prompt:"Open the Simulation tab, choose <b>Day vs. Night</b>, and switch to <b>Night</b>. Which statement correctly describes what happens?",
 options:[
  {id:"a",text:"The plant performs only cellular respiration, so it takes in oxygen and releases carbon dioxide."},
  {id:"b",text:"The plant performs only photosynthesis, so it releases oxygen and takes in carbon dioxide."},
  {id:"c",text:"The plant performs both processes at exactly equal rates, so there is no net gas exchange."},
  {id:"d",text:"The plant stops all cell activity until light returns."}
 ],
 correct:"a",
 why:"Without light, photosynthesis cannot run, but cellular respiration continues around the clock in every living cell. So at night the only gas exchange happening is respiration: oxygen in, carbon dioxide out \u2014 the reverse of what happens during a sunny day, as Graph 1 also shows (photosynthesis rate drops to 0 outside daylight hours while respiration stays constant)."},

{t:"fib",tab:"data",label:"Fill in the blank",
 prompt:"Complete both chemical equations below. Use the Data tables as a reference.",
 template:'<div class="eq">6CO<span class="sub">2</span> + 6H<span class="sub">2</span>O + {b1} energy &rarr; C<span class="sub">6</span>H<span class="sub">12</span>O<span class="sub">6</span> + 6{b2}</div>'+
          '<div class="eq">C<span class="sub">6</span>H<span class="sub">12</span>O<span class="sub">6</span> + 6O<span class="sub">2</span> &rarr; 6{b3} + 6H<span class="sub">2</span>O + {b4} (usable energy)</div>',
 blanks:[
  {id:"b1",accept:["light","light energy"],display:"light"},
  {id:"b2",accept:["o2","oxygen"],display:"O₂"},
  {id:"b3",accept:["co2","carbon dioxide"],display:"CO₂"},
  {id:"b4",accept:["atp"],display:"ATP"}
 ],
 why:"The first equation is photosynthesis: it uses light energy, carbon dioxide, and water to build glucose and release oxygen. The second equation is cellular respiration: it uses glucose and the oxygen photosynthesis released to release carbon dioxide, water, and ATP \u2014 the only one of the two equations that produces usable energy for the cell."},

{t:"cer",tab:"graph",label:"Constructed response (Claim, Evidence, Reasoning)",
 prompt:"A classmate says: \u201CPlants only do cellular respiration at night and only do photosynthesis during the day \u2014 the two processes never happen at the same time.\u201D Use Graph 1 and the Day vs. Night simulation to write a claim, evidence, and reasoning response explaining whether your classmate is correct.",
 ph:{c:"I disagree because ...",e:"Graph 1 shows that ... The simulation shows that during the day ...",r:"Cellular respiration has to keep running all the time because ... but photosynthesis only ..."},
 model:{
  c:"I disagree. Photosynthesis only happens during the day, when there's light, but cellular respiration happens continuously \u2014 during the day AND at night. The two processes do overlap during the day; it's only at night that respiration is the sole process running.",
  e:"Graph 1 shows the respiration rate staying at a constant 20 for all 24 hours of the day, while the photosynthesis rate is 0 outside of daylight hours (6 to 18) and rises during the day. The Day vs. Night simulation shows that in Day mode, both a photosynthesis rate (80) and a respiration rate (20) are shown at the same time \u2014 respiration doesn't switch off just because photosynthesis is running.",
  r:"Every living cell constantly needs ATP to carry out its basic activities, and only cellular respiration produces ATP, so respiration can't stop just because the sun goes down or comes up. Photosynthesis, on the other hand, directly depends on light energy as a reactant, so it can only happen when light is available. That's why daytime has both processes running together, with photosynthesis simply outpacing respiration, while nighttime has only respiration."},
 checks:["Claim: disagrees, and says photosynthesis only happens in daylight while respiration happens continuously, day and night.",
         "Evidence: cites Graph 1 (respiration rate constant at 20 all day; photosynthesis rate at 0 outside 6\u201318) or the Day/Night simulation showing both rates during the day.",
         "Reasoning: explains that cells constantly need ATP (only made by respiration) so respiration never stops, while photosynthesis depends on light and so only runs in daylight."],
 kw:{claim:[/disagree|incorrect|not\s+(correct|true|right)|is\s+wrong/i,/(both|day and night|all the time|continuously|constant|same time)/i],
     evidence:[/graph/i,/respiration/i,/photosynthesis/i,/night/i,/day/i,/rate/i,/simulation/i],
     reasoning:[/energy|atp/i,/continuous|always|constant|never\s+stops|all\s+the\s+time/i]}}
];

/* =========================================================
  DIAGRAM: THE CYCLE
  ========================================================= */
function op(hi,arr){return !hi?1:(arr.includes(hi)?1:0.15);}
function arrowColor(hi,arr,base){return (hi&&arr.includes(hi))?"#d99a00":base;}
function arrowWidth(hi,arr){return (hi&&arr.includes(hi))?4.5:2.5;}
function cycleDiagramSVG(hi){
hi=hi||null;
const W=700,H=280;
let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cycle diagram showing photosynthesis and cellular respiration exchanging glucose, oxygen, carbon dioxide, and water"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
g+=`<rect x="50" y="80" width="190" height="130" rx="16" fill="#bfe6c9" stroke="#1b7f4b" stroke-width="2.5"/>`;
g+=`<text x="145" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#1b7f4b">Chloroplast</text>`;
g+=`<text x="145" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#17365d">Photosynthesis</text>`;
g+=`<text x="145" y="170" font-size="11" text-anchor="middle" fill="#33475b">(plant &amp; algae cells only)</text>`;
g+=`<rect x="460" y="80" width="190" height="130" rx="45" fill="#f6cf9e" stroke="#b5610e" stroke-width="2.5"/>`;
g+=`<text x="555" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#b5610e">Mitochondrion</text>`;
g+=`<text x="555" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#17365d">Cellular</text><text x="555" y="166" font-size="13" font-weight="700" text-anchor="middle" fill="#17365d">respiration</text>`;
g+=`<text x="555" y="190" font-size="11" text-anchor="middle" fill="#33475b">(nearly all cells)</text>`;
const lightCol=arrowColor(hi,[],"#e0a100"),lightW=arrowWidth(hi,[]),lightOp=op(hi,[]);
g+=`<g opacity="${lightOp}"><line x1="145" y1="18" x2="145" y2="76" stroke="${lightCol}" stroke-width="${lightW}" marker-end="url(#arrLight)"/><text x="145" y="12" font-size="12" font-weight="700" text-anchor="middle" fill="#8a6a00">Light energy</text><defs><marker id="arrLight" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="${lightCol}"/></marker></defs></g>`;
const glcArr=["glc","o2"],glcCol=arrowColor(hi,glcArr,"#1f7a55"),glcW=arrowWidth(hi,glcArr),glcOp=op(hi,glcArr);
g+=`<g opacity="${glcOp}"><line x1="242" y1="115" x2="458" y2="115" stroke="${glcCol}" stroke-width="${glcW}" marker-end="url(#arrGlc)"/><text x="350" y="105" font-size="12.5" font-weight="700" text-anchor="middle" fill="${glcCol}">Glucose + O\u2082</text><defs><marker id="arrGlc" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="${glcCol}"/></marker></defs></g>`;
const co2Arr=["co2","h2o"],co2Col=arrowColor(hi,co2Arr,"#8a5fb0"),co2W=arrowWidth(hi,co2Arr),co2Op=op(hi,co2Arr);
g+=`<g opacity="${co2Op}"><line x1="458" y1="175" x2="242" y2="175" stroke="${co2Col}" stroke-width="${co2W}" marker-end="url(#arrCo2)"/><text x="350" y="195" font-size="12.5" font-weight="700" text-anchor="middle" fill="${co2Col}">CO\u2082 + H\u2082O</text><defs><marker id="arrCo2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="${co2Col}"/></marker></defs></g>`;
const atpArr=["atp"],atpCol=arrowColor(hi,atpArr,"#8a6a00"),atpW=arrowWidth(hi,atpArr),atpOp=op(hi,atpArr);
g+=`<g opacity="${atpOp}"><line x1="555" y1="212" x2="555" y2="250" stroke="${atpCol}" stroke-width="${atpW}" marker-end="url(#arrAtp)"/><text x="555" y="268" font-size="12" font-weight="700" text-anchor="middle" fill="${atpCol}">ATP \u2014 powers the cell</text><defs><marker id="arrAtp" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="${atpCol}"/></marker></defs></g>`;
return g+`</svg>`;
}
function chloroplastInternalSVG(){
const W=700,H=250;
let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Inside the chloroplast: the light reactions in the thylakoid membranes and the Calvin cycle in the stroma"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
g+=`<rect x="30" y="55" width="640" height="170" rx="30" fill="#e6f5ea" stroke="#1b7f4b" stroke-width="2.5"/>`;
g+=`<text x="350" y="38" font-size="15" font-weight="700" text-anchor="middle" fill="#1b7f4b">Chloroplast</text>`;
g+=`<rect x="60" y="80" width="270" height="120" rx="10" fill="#8fd1a0" stroke="#1b7f4b" stroke-width="2"/>`;
g+=`<text x="195" y="100" font-size="12" text-anchor="middle" fill="#0f3d22">Thylakoid membranes</text>`;
g+=`<text x="195" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d22">Light reactions</text>`;
g+=`<text x="195" y="138" font-size="10.5" text-anchor="middle" fill="#17365d">Splits H\u2082O using light energy</text>`;
g+=`<rect x="370" y="80" width="270" height="120" rx="10" fill="#d9f0df" stroke="#1b7f4b" stroke-width="2"/>`;
g+=`<text x="505" y="100" font-size="12" text-anchor="middle" fill="#0f3d22">Stroma</text>`;
g+=`<text x="505" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d22">Calvin cycle</text>`;

function genChart(o){
const W=o.w||620,H=o.h||320,L=60,R=18,T=o.legend?36:18,B=48;
const X=v=>L+(v-o.xmin)/(o.xmax-o.xmin)*(W-L-R),Y=v=>H-B-(v-o.ymin)/(o.ymax-o.ymin)*(H-T-B);
let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.aria}"><rect width="${W}" height="${H}" fill="#fff" stroke="#9db2c9"/>`;
for(let v=o.ymin;v<=o.ymax+1e-9;v+=o.ystep)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2eaf2"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end">${v}</text>`;
for(let v=o.xmin;v<=o.xmax+1e-9;v+=o.xstep)g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="#eef4fa"/><text x="${X(v)}" y="${H-B+16}" font-size="11" text-anchor="middle">${v}</text>`;
g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#33475b" stroke-width="2"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#33475b" stroke-width="2"/>`;
g+=`<text x="${(L+W-R)/2}" y="${H-10}" font-size="12.5" font-weight="600" text-anchor="middle">${o.xlabel}</text>`;
g+=`<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" font-size="12.5" font-weight="600" text-anchor="middle">${o.ylabel}</text>`;
(o.series||[]).forEach(s=>{const pts=[];for(let v=o.xmin;v<=o.xmax+1e-9;v+=(o.xmax-o.xmin)/160)pts.push([v,s.fn(v)]);
 g+=`<polyline fill="none" stroke="${s.col}" stroke-width="3" points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(Math.max(o.ymin,Math.min(o.ymax,p[1]))).toFixed(1)).join(" ")}"/>`;});
if(o.legend)(o.series||[]).forEach((s,i)=>{const lx=L+i*(o.legW||200);g+=`<line x1="${lx}" x2="${lx+22}" y1="18" y2="18" stroke="${s.col}" stroke-width="3.5"/><text x="${lx+28}" y="22" font-size="11.5">${s.name}</text>`;});
return g+`</svg>`;
}

let tab="passage";
function stimHTML(){
const tabs=[["passage","Passage"],["diagram","Diagram"],["graph","Graph"],["data","Data tables"],["sim","Simulation"]];
let h=`<div class="tabs" role="tablist">`+tabs.map(t=>`<button class="tab" role="tab" aria-selected="${tab===t[0]}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")+`</div><div class="tabbody">`;
if(tab==="passage") h+=`
 <div class="phen"><b>Phenomenon:</b> A sealed glass terrarium \u2014 a jar with soil, moss, and a small plant, closed tight with no air holes \u2014 can keep the same plant alive and green for years, with nobody ever opening the lid to add water, food, or fresh air. How can a completely sealed system support life indefinitely?</div>
 <div class="passage">
 <h2>How Photosynthesis and Cellular Respiration Are Related</h2>
 <p>Photosynthesis and cellular respiration are often taught as two separate topics, but they are really two halves of the same story: each process makes exactly what the other one needs, and each process needs exactly what the other one makes.</p>
 <p><mark>Photosynthesis</mark> takes place inside <mark>chloroplasts</mark>, organelles found only in plant and algae cells (never in animal cells). Using light energy, chloroplasts combine carbon dioxide and water to build <mark>glucose</mark>, releasing oxygen as a byproduct: 6CO<span class="sub">2</span> + 6H<span class="sub">2</span>O + light energy &rarr; C<span class="sub">6</span>H<span class="sub">12</span>O<span class="sub">6</span> + 6O<span class="sub">2</span>. In effect, photosynthesis captures light energy and stores it as chemical energy inside the bonds of glucose. This happens in two connected stages: the <mark>light reactions</mark>, in the thylakoid membranes, which use light energy to split water and produce O\u2082, ATP, and NADPH; and the <mark>Calvin cycle</mark> (also called the light-independent or "dark" reactions), in the stroma, which uses that ATP and NADPH to turn CO\u2082 into glucose.</p>
 <p><mark>Cellular respiration</mark> takes place inside <mark>mitochondria</mark>, organelles found in nearly every eukaryotic cell \u2014 plant cells and animal cells alike. Cellular respiration breaks glucose back down using oxygen, releasing carbon dioxide and water as waste products and, most importantly, releasing usable energy in the form of <mark>ATP</mark>: C<span class="sub">6</span>H<span class="sub">12</span>O<span class="sub">6</span> + 6O<span class="sub">2</span> &rarr; 6CO<span class="sub">2</span> + 6H<span class="sub">2</span>O + ATP. Unlike glucose, ATP is a form of energy a cell's machinery can use directly and immediately. This happens in three main steps: <mark>glycolysis</mark>, in the cytoplasm, which splits glucose into pyruvate and yields a small amount of ATP without needing oxygen; the <mark>Krebs cycle</mark>, in the mitochondrial matrix, which breaks pyruvate down further and releases CO\u2082; and the <mark>electron transport chain</mark>, on the inner mitochondrial membrane, which finally uses oxygen to produce the large majority of the cell's ATP.</p>
 <p>Notice that the reactants of one process are the products of the other, and vice versa. This means the two processes can run in a continuous <mark>cycle</mark>, recycling the same carbon dioxide, water, glucose, and oxygen back and forth \u2014 which is exactly how a sealed terrarium can support a plant indefinitely without ever being opened. But the two processes are not simply the same reaction running in reverse: photosynthesis captures energy from an outside source (sunlight), while cellular respiration gradually releases that stored energy as ATP the cell can actually use. Only cellular respiration produces ATP \u2014 photosynthesis does not.</p>
 <p>Because only plant and algae cells have chloroplasts, only they can carry out photosynthesis. But every living cell, plant or animal, has mitochondria and constantly carries out cellular respiration \u2014 day and night, whether or not light is available. A plant cell is unusual in that it performs both processes: photosynthesis only in the light, and respiration all the time.</p>
 <div class="phen"><b>Real-world connection:</b> This cycle operates on a planet-wide scale, too. Forests and oceans full of photosynthesizing organisms are the reason Earth's atmosphere has enough oxygen for animals (and plants themselves) to breathe, while the carbon dioxide that all that respiration releases \u2014 from plants, animals, fungi, and more \u2014 becomes the raw material for the next round of photosynthesis. Disrupting either half of this cycle, for instance through large-scale deforestation, affects both the oxygen supply and the carbon dioxide levels of the whole atmosphere.</div>
 </div><div class="cap">Passage written for classroom use.</div>`;

 <figure><h2>Diagram 2: Inside the chloroplast</h2>${chloroplastInternalSVG()}<figcaption class="cap">The light reactions (in the thylakoid membranes) use light energy and water to make O\u2082, ATP, and NADPH. The Calvin cycle (in the stroma) uses that ATP and NADPH, plus CO\u2082, to build glucose.</figcaption></figure>
 <figure><h2>Diagram 3: Inside the mitochondrion (and the cytoplasm)</h2>${mitochondrionInternalSVG()}<figcaption class="cap">Glycolysis happens first, in the cytoplasm, breaking glucose into pyruvate. The Krebs cycle (in the matrix) breaks pyruvate down further, releasing CO\u2082. The electron transport chain (on the inner membrane) then uses O\u2082 to produce the large majority of the ATP.</figcaption></figure>`;

 <h2>Table 1: Comparing the two processes</h2>

 <tr><td>Calvin cycle</td><td>Photosynthesis</td><td>Stroma</td><td>CO\u2082, ATP, NADPH</td><td>Glucose</td></tr>
 <tr><td>Glycolysis</td><td>Cellular respiration</td><td>Cytoplasm</td><td>Glucose</td><td>Pyruvate, small amount of ATP</td></tr>
 <tr><td>Krebs cycle</td><td>Cellular respiration</td><td>Mitochondrial matrix</td><td>Pyruvate</td><td>CO\u2082, NADH/FADH\u2082, small amount of ATP</td></tr>
 <tr><td>Electron transport chain</td><td>Cellular respiration</td><td>Inner mitochondrial membrane</td><td>NADH/FADH\u2082, O\u2082</td><td>Large amount of ATP, H\u2082O</td></tr>
 </table>
 <h2>Table 3: Role of each molecule</h2>
 <table class="data"><tr><th>Molecule</th><th>Produced by</th><th>Used by</th></tr>
 <tr><td>Carbon dioxide (CO\u2082)</td><td>Cellular respiration</td><td>Photosynthesis</td></tr>
 <tr><td>Water (H\u2082O)</td><td>Cellular respiration</td><td>Photosynthesis</td></tr>
 <tr><td>Glucose (C\u2086H\u2081\u2082O\u2086)</td><td>Photosynthesis</td><td>Cellular respiration</td></tr>
 <tr><td>Oxygen (O\u2082)</td><td>Photosynthesis</td><td>Cellular respiration</td></tr>
 <tr><td>ATP</td><td>Cellular respiration only</td><td>Nearly every cell activity (not photosynthesis)</td></tr>
 </table>
 <h2>Table 4: Which organisms do which process</h2>
 <table class="data"><tr><th>Organism type</th><th>Photosynthesis?</th><th>Cellular respiration?</th></tr>
 <tr><td>Plants &amp; algae</td><td>Yes</td><td>Yes</td></tr>
 <tr><td>Photosynthetic bacteria (e.g., cyanobacteria)</td><td>Yes</td><td>Yes</td></tr>
 <tr><td>Animals</td><td>No</td><td>Yes</td></tr>
 <tr><td>Fungi</td><td>No</td><td>Yes</td></tr>
 <tr><td>Most other bacteria</td><td>No</td><td>Yes</td></tr>
 </table>
 <div class="formula"><b>Key relationship</b><br>Photosynthesis: CO\u2082 + H\u2082O + light energy &rarr; glucose + O\u2082 (stores energy).<br>Cellular respiration: glucose + O\u2082 &rarr; CO\u2082 + H\u2082O + ATP (releases usable energy).<br>Each process's products are the other process's reactants \u2014 but only respiration makes ATP.</div>`;
if(tab==="sim") h+=simHTML();
return h+`</div>`;
}

/* =========================================================
  QUESTION RENDERING
  ========================================================= */
function isAnswered(i){const q=QS[i],a=ans[i];
if(q.t==="mc")return a!==undefined&&a!==null;
if(q.t==="fib")return a&&q.blanks.every(b=>String(a[b.id]||"").trim()!=="");
if(q.t==="cer")return !!(a&&(a.c||a.e||a.r));
return false;}
function qHTML(i){
const q=QS[i],a=ans[i];
let h=`<div class="qbody"><div><span class="qnum">${i+1}</span><b>Question ${i+1} of ${QS.length}</b></div><div class="qtype">${q.label}</div><div class="prompt">${q.prompt}</div>`;
if(q.t==="mc"){
 h+=q.options.map(o=>`<label class="opt ${a===o.id?"sel":""}"><input type="radio" name="mcq${i}" ${a===o.id?"checked":""} onclick="setMC('${o.id}')"><span>${o.text}</span></label>`).join("");
}
if(q.t==="fib"){
 h+=`<div class="hint">Tip: use Table 1 and Table 3 in the Data tables tab.</div>`;
 let tmpl=q.template;
 q.blanks.forEach(b=>{
  const val=(a&&a[b.id]!==undefined)?esc(a[b.id]):"";
  tmpl=tmpl.replace("{"+b.id+"}",`<input type="text" aria-label="blank ${b.id}" value="${val}" oninput="setFib('${b.id}',this.value)">`);
 });
 h+=tmpl;
}
if(q.t==="cer"){
 const v=a||{c:"",e:"",r:""};
 h+=`<div class="hint">Use the <b>Graph</b> and <b>Simulation</b> tabs (Day vs. Night mode). Write in complete sentences.</div>
 <div class="cerbox"><label for="cc">Claim</label><textarea id="cc" oninput="setCER('c',this.value)" onpaste="return false" placeholder="${q.ph.c}">${esc(v.c)}</textarea></div>
 <div class="cerbox"><label for="ce">Evidence</label><textarea id="ce" oninput="setCER('e',this.value)" onpaste="return false" placeholder="${q.ph.e}">${esc(v.e)}</textarea></div>
 <div class="cerbox"><label for="cr">Reasoning</label><textarea id="cr" oninput="setCER('r',this.value)" onpaste="return false" placeholder="${q.ph.r}">${esc(v.r)}</textarea></div>`;
}
return h+`</div>`;
}
function setMC(id){ans[cur]=id;$("#qp").innerHTML=qHTML(cur);refreshChips();}
function setFib(id,val){const a=ans[cur]||{};a[id]=val;ans[cur]=a;refreshChips();}
function setCER(k,v){const a=ans[cur]||{c:"",e:"",r:""};a[k]=v;ans[cur]=a;refreshChips();}
function refreshChips(){const c=$("#chips");if(c)c.innerHTML=chipsHTML();}

/* =========================================================
  NAVIGATION / SCREENS
  ========================================================= */
let screen="intro",cur=0,ans={},flagged=new Set(),student={first:"",last:"",period:"",teacher:""},selfChecks=[false,false,false],fsize=17,cerRevised=false;
function setTab(t){tab=t;const s=$("#stim");if(s){s.innerHTML=stimHTML();}if(t==="sim")updateSim();}
function go(i){cur=i;tab=QS[i].tab;if(QS[i].simMode)sim.mode=QS[i].simMode;screen="test";render();}
function next(){if(cur<QS.length-1)go(cur+1);else openReview();}
function prev(){if(cur>0)go(cur-1);}
function toggleFlag(){flagged.has(cur)?flagged.delete(cur):flagged.add(cur);render(true);}
function openReview(){screen="review";render();}
function submitAll(){autoCheckCER();screen="results";window.scrollTo(0,0);render();}
function reviseCER(){if(cerRevised)return;cur=QS.findIndex(q=>q.t==="cer");tab=QS[cur].tab;screen="reviseCER";render();window.scrollTo(0,0);}
function saveRevision(){cerRevised=true;autoCheckCER();screen="results";render();window.scrollTo(0,0);}
function autoCheckCER(){
const cerIdx=QS.findIndex(q=>q.t==="cer"),kw=QS[cerIdx].kw,a=ans[cerIdx]||{c:"",e:"",r:""};
const all=((a.c||"")+" "+(a.e||"")+" "+(a.r||"")).toLowerCase(),c=(a.c||"").toLowerCase();
const claimOK=kw.claim[0].test(c)&&kw.claim[1].test(all);
const evidenceOK=kw.evidence.filter(p=>p.test(all)).length>=2;
const reasoningOK=kw.reasoning[0].test(all)&&kw.reasoning[1].test(all);
selfChecks=[claimOK,evidenceOK,reasoningOK];
}
function fs(d){fsize=Math.min(24,Math.max(13,fsize+d*2));document.documentElement.style.setProperty("--fs",fsize+"px");}
function startTest(){
const sid=($("#sid")||{value:""}).value.trim(),f=($("#fn")||{value:""}).value.trim(),l=($("#ln")||{value:""}).value.trim(),p=($("#pd")||{value:""}).value.trim(),t=($("#tc")||{value:""}).value.trim();
if(!sid||!f||!l||!p||!t){const e=$("#nmerr");if(e)e.style.display="block";return;}
student={id:sid,first:f,last:l,period:p,teacher:t};
go(0);
}
function sendToSheet(){
const st=$("#sheetStatus");
if(typeof SHEETS_WEBHOOK_URL==="undefined"||!SHEETS_WEBHOOK_URL||SHEETS_WEBHOOK_URL.indexOf("PASTE")>=0){
 if(st)st.textContent="This activity isn't connected to your teacher's gradebook sheet yet.";
 return;
}
const auto=autoTotal(),autoMax=QS.filter(q=>q.t!=="cer").length,n=selfChecks.filter(Boolean).length;
const body=new URLSearchParams({studentId:student.id,firstName:student.first,lastName:student.last,period:student.period,teacher:student.teacher,activity:SHEETS_ACTIVITY_NAME,score:String(auto+n),total:String(autoMax+3),when:new Date().toString()});
if(st)st.textContent="Sending...";
fetch(SHEETS_WEBHOOK_URL,{method:"POST",mode:"no-cors",body:body})
 .then(function(){if(st)st.textContent="Sent! Your teacher will see your score.";})
 .catch(function(){if(st)st.textContent="Could not send \u2014 check your internet connection and try again.";});
}
function chipsHTML(){
return QS.map((q,i)=>`<button class="chip ${i===cur?"cur":""} ${isAnswered(i)?"done":""} ${flagged.has(i)?"flag":""}" onclick="go(${i})" aria-label="Question ${i+1}${isAnswered(i)?", answered":""}${flagged.has(i)?", flagged":""}">${i+1}</button>`).join("");
}
function introHTML(){
return `<div class="screen">
 <h2>Photosynthesis &amp; Cellular Respiration: How They're Related</h2>
 <p>This is a short warm-up (about 10 to 15 minutes) that works like a computer-based science test. Read the passage, study the diagrams, graph, and data, and run the simulation. Then answer ${QS.length} questions.</p>
 <div class="phen"><b>Driving question:</b> How can a completely sealed terrarium keep a plant alive for years with no air, food, or water ever added?</div>
 <h3>Directions</h3>
 <ul>
  <li>Use the tabs on the left (Passage, Diagram, Graph, Data tables, Simulation) to find evidence.</li>
  <li>Answer on the right. Use the numbered circles at the bottom to move between questions. Flag a question to come back to it.</li>
  <li>Question 2 asks you to use the simulation. Question ${QS.length} asks for a written Claim, Evidence, and Reasoning response.</li>
  <li>When you finish, choose <b>Review and submit</b> to see your score and an explanation for each question.</li>
 </ul>
 <div class="namebox"><b>Student information</b> (required \u2014 used to record your score)
  <div class="row">
   <div class="fld"><label for="sid">Student ID</label><input id="sid" autocomplete="off" inputmode="numeric"></div>
   <div class="fld"><label for="fn">First name</label><input id="fn" autocomplete="off"></div>
   <div class="fld"><label for="ln">Last name</label><input id="ln" autocomplete="off"></div>
   <div class="fld pd"><label for="pd">Period</label><input id="pd" autocomplete="off"></div>
   <div class="fld"><label for="tc">Teacher's name</label><input id="tc" autocomplete="off"></div>
  </div>
  <div class="err" id="nmerr">Please fill in all four fields before starting.</div>
 </div>
 <button class="btn" onclick="startTest()">Begin warm-up</button>
</div>`;
}
function testHTML(){
return `<div class="app">
 <section class="stim" id="stim" aria-label="Stimulus">${stimHTML()}</section>
 <section class="qp" id="qp" aria-label="Question">${qHTML(cur)}</section>
</div>
<div class="foot">
 <div><button class="btn ghost" onclick="prev()" ${cur===0?"disabled":""}>Previous</button></div>
 <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center">
   <button class="flagbtn ${flagged.has(cur)?"on":""}" onclick="toggleFlag()">${flagged.has(cur)?"Flagged":"Flag for review"}</button>
   <div class="chips" id="chips">${chipsHTML()}</div>
 </div>
 <div><button class="btn" onclick="next()">${cur===QS.length-1?"Review and submit":"Next"}</button></div>
</div>`;
}
function reviseCERHTML(){
return `<div class="app">
 <section class="stim" id="stim" aria-label="Stimulus">${stimHTML()}</section>
 <section class="qp" id="qp" aria-label="Question">${qHTML(cur)}</section>
</div>
<div class="foot">
 <div></div>
 <div style="text-align:center"><p class="small" style="margin:0"><b>Revising your response.</b> This is your only chance to change it.</p></div>
 <div><button class="btn" onclick="saveRevision()">Save revision and return to results</button></div>
</div>`;
}
function reviewHTML(){
const un=QS.map((q,i)=>i).filter(i=>!isAnswered(i));
return `<div class="screen">
 <h2>Review your answers</h2>
 <p>${un.length?`You have <b>${un.length}</b> unanswered question${un.length>1?"s":""}: ${un.map(i=>i+1).join(", ")}.`:"All questions have an answer."} Select a question to go back to it.</p>
 <div class="rvlist">${QS.map((q,i)=>`<button class="rvitem ${isAnswered(i)?"done":"todo"}" onclick="go(${i})"><b>Question ${i+1}${flagged.has(i)?" (flagged)":""}</b>${isAnswered(i)?"Answered":"Not answered"}</button>`).join("")}</div>
 <button class="btn" onclick="submitAll()">Submit and see results</button>
 <button class="btn ghost" onclick="go(QS.length-1)" style="margin-left:8px">Back to task</button>
</div>`;
}

/* =========================================================
  SCORING + RESULTS
  ========================================================= */
function score(i){
const q=QS[i],a=ans[i];
if(a===undefined||a===null)return 0;
if(q.t==="mc")return a===q.correct?1:0;
if(q.t==="fib")return q.blanks.every(b=>{const n=norm(a[b.id]);return b.accept.map(norm).includes(n);})?1:0;
return 0;
}
function yourText(i){
const q=QS[i],a=ans[i];
if(a===undefined||a===null)return "No answer";
if(q.t==="mc"){const o=q.options.find(o=>o.id===a);return o?esc(o.text):"No answer";}
if(q.t==="fib")return q.blanks.map(b=>b.id.toUpperCase()+": "+(a[b.id]?esc(a[b.id]):"blank")).join("<br>");
return "";
}
function keyText(i){
const q=QS[i];
if(q.t==="mc")return esc(q.options.find(o=>o.id===q.correct).text);
if(q.t==="fib")return q.blanks.map(b=>b.id.toUpperCase()+": "+b.display).join("<br>");
return "";
}
function toggleSelf(k){selfChecks[k]=!selfChecks[k];const n=selfChecks.filter(Boolean).length;$("#cerscore").textContent=n;$("#totalscore").textContent=autoTotal()+n;}
function autoTotal(){let t=0;QS.forEach((q,i)=>{if(q.t!=="cer")t+=score(i);});return t;}
function resultsHTML(){
const auto=autoTotal(),autoMax=QS.filter(q=>q.t!=="cer").length,cerIdx=QS.findIndex(q=>q.t==="cer"),cq=QS[cerIdx],ca=ans[cerIdx]||{c:"",e:"",r:""};
const n=selfChecks.filter(Boolean).length;
let h=`<div class="screen">
 <h2>Results: ${esc(student.first)} ${esc(student.last)} \u2014 Period ${esc(student.period)} \u2014 ${esc(student.teacher)}</h2>
 <div>Questions 1\u2013${autoMax} (scored automatically): <span class="score">${auto} / ${autoMax}</span></div>
 <div>Question ${QS.length} (Claim, Evidence, Reasoning; auto-checked from keywords): <b><span id="cerscore">${n}</span> / 3</b></div>
 <div>Total: <b><span id="totalscore">${auto+n}</span> / ${autoMax+3}</b></div>
 <p class="noprint"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn ghost" onclick="sendToSheet()">Send my score to my teacher</button></p>
 <p class="sheetbox noprint" id="sheetStatus"></p>`;
QS.forEach((q,i)=>{
 if(q.t==="cer")return;
 const ok=score(i)===1;
 h+=`<div class="res ${ok?"good":"miss"}"><h4>Question ${i+1}<span class="tag ${ok?"good":"miss"}">${ok?"Correct":"Not yet"}</span></h4>
   <div><b>Your answer:</b><br>${yourText(i)}</div>
   ${ok?"":`<div style="margin-top:6px"><b>Correct answer:</b><br>${keyText(i)}</div>`}
   <div class="model" style="margin-top:8px">${q.why}</div></div>`;
});
h+=`<div class="res self"><h4>Question ${QS.length}: Claim, Evidence, Reasoning</h4>
  <div><b>Your claim:</b></div><div class="resp">${esc(ca.c||"(blank)")}</div>
  <div><b>Your evidence:</b></div><div class="resp">${esc(ca.e||"(blank)")}</div>
  <div><b>Your reasoning:</b></div><div class="resp">${esc(ca.r||"(blank)")}</div>
  <div class="model" oncopy="return false" style="user-select:none"><b>Model response</b><br><b>Claim:</b> ${cq.model.c}<br><b>Evidence:</b> ${cq.model.e}<br><b>Reasoning:</b> ${cq.model.r}</div>
  <p><b>Auto-checked.</b> These boxes were checked automatically based on keywords in your response (not a full reading). Compare your response to the model and adjust any box that isn't right.</p>
  <div class="checks">${cq.checks.map((c,k)=>`<label><input type="checkbox" ${selfChecks[k]?"checked":""} onchange="toggleSelf(${k})"> ${c}</label>`).join("")}</div>
  ${cerRevised?`<p class="small" style="margin-top:10px"><b>You have used your one revision for this response.</b></p>`:`<p class="noprint" style="margin-top:10px"><button class="btn ghost" onclick="reviseCER()">Revise your answer (one chance)</button></p>`}
  </div>`;
return h+`</div>`;
}

/* =========================================================
  RENDER
  ========================================================= */
function render(keepScroll){
const root=$("#root");
let sy=0,qy=0;
if(keepScroll){const s=$("#stim"),q=$("#qp");if(s)sy=s.scrollTop;if(q)qy=q.scrollTop;}
root.innerHTML=screen==="intro"?introHTML():screen==="test"?testHTML():screen==="reviseCER"?reviseCERHTML():screen==="review"?reviewHTML():resultsHTML();
if(keepScroll){const s=$("#stim"),q=$("#qp");if(s)s.scrollTop=sy;if(q)q.scrollTop=qy;}
if((screen==="test"||screen==="reviseCER")&&tab==="sim")updateSim();
root.style.overflow=(screen==="test"||screen==="reviseCER")?"hidden":"auto";
}
render();

</script>
</body>
</html>
